  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#03070f; --bg2:#060d1a; --bg3:#0a1628;
      --surface:rgba(255,255,255,0.035); --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
      --text:#e2e8f0; --muted:#64748b; --faint:#1e293b;
      --me:#22d3ee; --me-dim:rgba(34,211,238,0.12); --me-border:rgba(34,211,238,0.25);
      --qu:#a78bfa; --qu-dim:rgba(167,139,250,0.12); --qu-border:rgba(167,139,250,0.25);
      --gold:#fbbf24; --red:#f43f5e; --green:#34d399;
    }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:99px; }
    ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.15); }

    .sidebar { background:var(--bg2); border-right:1px solid var(--border); position:relative; }
    .sidebar::before { content:''; position:absolute; top:0;left:0;right:0;height:200px; background:radial-gradient(ellipse at top left,rgba(34,211,238,0.07),transparent 70%); pointer-events:none; }
    .logo-icon { width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0891b2,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 0 20px rgba(8,145,178,0.4); }
    .vlife-logo-bar { background:#000;padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden; }
    .vlife-logo-bar::after { content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,0.18),transparent); }

    .cat-btn { width:100%;text-align:left;padding:8px 12px;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:500;background:transparent;color:var(--muted);transition:all 0.14s ease;margin-bottom:2px;position:relative; }
    .cat-btn:hover { background:var(--surface);color:var(--text); }
    .cat-btn.active { background:rgba(34,211,238,0.08);color:var(--me);font-weight:700; }
    .cat-btn.active::before { content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:99px;background:var(--me); }
    .cat-btn.active-qu { background:var(--qu-dim);color:var(--qu);font-weight:700; }
    .cat-btn.active-qu::before { background:var(--qu); }
    .cat-btn.active-body { background:rgba(251,191,36,0.08);color:var(--gold);font-weight:700; }
    .cat-btn.active-body::before { background:var(--gold); }

    .badge { font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--faint);color:var(--muted);min-width:22px;text-align:center;font-family:'JetBrains Mono',monospace;transition:all 0.14s; }
    .cat-btn.active .badge { background:rgba(255,255,255,0.08);color:var(--me); }
    .cat-btn.active-qu .badge { background:rgba(255,255,255,0.08);color:var(--qu); }
    .cat-btn.active-body .badge { background:rgba(255,255,255,0.08);color:var(--gold); }

    .macro-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px;cursor:pointer;transition:all 0.18s ease;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden; }
    .macro-card::after { content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.18s;background:linear-gradient(135deg,rgba(34,211,238,0.04),transparent 60%); }
    .macro-card:hover { border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4); }
    .macro-card:hover::after { opacity:1; }
    .macro-card:active { transform:scale(0.99); }
    .macro-card.is-qu::after { background:linear-gradient(135deg,rgba(167,139,250,0.05),transparent 60%); }
    .macro-card.is-qu:hover { border-color:rgba(167,139,250,0.2); }
    .macro-card.copied-me { border-color:rgba(34,211,238,0.4)!important;background:rgba(34,211,238,0.06)!important; }
    .macro-card.copied-qu { border-color:rgba(167,139,250,0.4)!important;background:rgba(167,139,250,0.06)!important; }

    .chip-me { display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;padding:3px 9px;border-radius:6px;background:var(--me-dim);color:var(--me);border:1px solid var(--me-border);font-family:'JetBrains Mono',monospace; }
    .chip-qu { display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;padding:3px 9px;border-radius:6px;background:var(--qu-dim);color:var(--qu);border:1px solid var(--qu-border);font-family:'JetBrains Mono',monospace; }

    input,textarea,select { background:rgba(255,255,255,0.04)!important;color:var(--text)!important;border:1px solid var(--border2)!important;outline:none!important;transition:border-color 0.15s,box-shadow 0.15s!important;font-family:'Inter',sans-serif!important; }
    input:focus,textarea:focus,select:focus { border-color:var(--me)!important;box-shadow:0 0 0 3px rgba(34,211,238,0.1)!important; }
    select option { background:#0d1b2e; }

    .modal-bg { position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.18s ease; }
    .modal-box { background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:28px;width:100%;max-width:540px;box-shadow:0 40px 100px rgba(0,0,0,0.8);animation:slideUp 0.2s ease;position:relative;overflow:hidden; }
    .modal-box::before { content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,0.4),transparent); }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(18px) scale(0.97)}to{opacity:1;transform:none} }

    .toast-wrap { position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none; }
    .toast-inner { padding:11px 22px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,0.6);white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .toast-me { background:#022c22;border:1px solid rgba(34,211,238,0.35);color:#6ee7b7; }
    .toast-qu { background:#1e1040;border:1px solid rgba(167,139,250,0.35);color:#c4b5fd; }

    .drop-zone { border:2px dashed var(--border2);border-radius:14px;padding:50px 24px;text-align:center;cursor:pointer;transition:all 0.2s; }
    .drop-zone:hover,.drop-zone.over { border-color:var(--me);background:var(--me-dim); }

    .action-btn { width:100%;padding:9px 13px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--muted);transition:all 0.15s;margin-bottom:6px;font-family:'Inter',sans-serif; }
    .action-btn:hover { transform:translateX(3px);color:var(--text);border-color:var(--border2); }

    .fav-btn { transition:transform 0.2s; }
    .fav-btn:hover { transform:scale(1.4); }

    .topbar { border-bottom:1px solid var(--border);background:var(--bg2);padding:11px 20px;display:flex;align-items:center;gap:10px;position:relative;min-height:56px; }
    .topbar::after { content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,0.12),transparent); }
    .topbar::before { content:'SAMU 93 · vLifeRoleplay';position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.08);font-family:'JetBrains Mono',monospace;pointer-events:none; }

    .create-btn { background:linear-gradient(135deg,#0891b2,#4f46e5);border:none;color:white;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(8,145,178,0.25);transition:all 0.15s;font-family:'Inter',sans-serif;white-space:nowrap; }
    .create-btn:hover { transform:translateY(-1px);box-shadow:0 6px 28px rgba(8,145,178,0.4); }

    .section-label { font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:9px;padding:0 4px; }
    .key-tag { background:rgba(255,255,255,0.05);border:1px solid var(--border2);padding:1px 7px;border-radius:5px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace; }

    .type-toggle-btn { flex:1;padding:10px;border-radius:10px;border:1px solid var(--border2);cursor:pointer;font-size:12.5px;font-weight:800;transition:all 0.15s;font-family:'Inter',sans-serif; }
    .copy-line { display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-top:2px;transition:color 0.2s; }

    /* ─── BODY SCHEMA ─── */
    .body-wrap { display:flex;flex:1;overflow:hidden;min-height:0; }
    .body-svg-col { display:flex;flex-direction:column;align-items:center;padding:16px 12px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0; }
    .body-actions-col { flex:1;overflow-y:auto;padding:20px; }

    .zone-shape { cursor:pointer;transition:all 0.14s ease; }
    .zone-shape:hover { filter:brightness(1.4); }

    .action-card { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;margin-bottom:8px; }
    .action-card:hover { border-color:var(--border2);transform:translateX(3px); }
    .action-card:active { transform:scale(0.99); }
    .action-card.copied { border-color:rgba(34,211,238,0.4);background:rgba(34,211,238,0.06); }

    .zone-pill { display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:0.04em; }

    /* ─── PROCÉDURES ─── */
    .proc-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;transition:all 0.17s ease;position:relative;overflow:hidden; }
    .proc-card:hover { transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4); }
    .proc-card::before { content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px 0 0 2px; }

    .step-item { border-radius:12px;padding:12px 15px;margin-bottom:7px;cursor:pointer;transition:all 0.15s;border:1px solid;position:relative; }
    .step-item.done { background:rgba(52,211,153,0.06);border-color:rgba(52,211,153,0.2); }
    .step-item.current { border-color:var(--me);background:var(--me-dim);box-shadow:0 0 20px rgba(34,211,238,0.08); }
    .step-item.pending { background:var(--surface);border-color:var(--border); }
    .step-item.current:hover { box-shadow:0 0 28px rgba(34,211,238,0.15); }
    .step-item.pending:hover { border-color:var(--border2); }

    .step-num { width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0; }
    .step-num.done { background:rgba(52,211,153,0.2);color:#34d399; }
    .step-num.current { background:var(--me-dim);color:var(--me);border:1.5px solid var(--me); }
    .step-num.pending { background:var(--faint);color:var(--muted); }

    .prog-bar-outer { height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin:8px 0 14px; }
    .prog-bar-inner { height:100%;border-radius:99px;transition:width 0.3s ease; }

    .copy-next-btn { width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;font-family:'Inter',sans-serif; }


    /* ─── PERFUSION ─── */
    .perf-wrap { display:flex;flex:1;overflow:hidden;min-height:0; }
    .perf-side { width:288px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:18px 12px; }
    .perf-main { flex:1;overflow-y:auto;padding:22px 26px 40px; }

    .perf-modebar { display:flex;gap:9px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap; }
    .perf-modebtn { display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s; }
    .perf-modebtn:hover { border-color:var(--border2);color:#cbd5e1; }

    .perf-panel { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px; }
    .perf-lbl { font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:9px;padding-left:3px; }
    .perf-note { background:rgba(34,211,238,0.05);border:1px solid rgba(34,211,238,0.16);border-radius:12px;padding:13px 16px;font-size:11.5px;color:#94a3b8;line-height:1.7; }
    .perf-note b { color:#22d3ee; }
    .perf-empty { text-align:center;color:#334155;font-size:12.5px;padding:36px 20px;line-height:1.7; }

    .perf-chip { padding:6px 12px;border-radius:99px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.14s;white-space:nowrap; }
    .perf-chip:hover { border-color:var(--me);color:var(--me); }

    .perf-drug-card { border-radius:12px;padding:11px 13px;cursor:pointer;transition:all 0.15s; }
    .perf-drug-card:hover { transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,0.35); }
    .perf-solv-card { border-radius:11px;padding:10px 12px;cursor:pointer;transition:all 0.15s; }
    .perf-solv-card:hover { transform:translateX(2px); }
    .perf-cas-card { border-radius:11px;padding:10px 12px;cursor:pointer;transition:all 0.15s;margin-bottom:6px; }
    .perf-cas-card:hover { transform:translateX(3px); }

    .perf-etiquette { margin-top:16px;background:rgba(255,255,255,0.03);border:1px dashed;border-radius:12px;padding:13px 15px; }
    .perf-reset { width:100%;margin-top:14px;padding:9px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s; }
    .perf-reset:hover { border-color:var(--border2);color:#cbd5e1; }
    .perf-nav { padding:10px 20px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s; }
    .perf-nav:hover:not(:disabled) { border-color:var(--border2);color:#e2e8f0; }

    .perf-enonce { background:rgba(255,255,255,0.03);border:1px solid var(--border);border-left:3px solid #22d3ee;border-radius:12px;padding:15px 18px;font-size:12.5px;color:#cbd5e1;line-height:1.8; }
    .perf-score { text-align:center;border:1px solid;border-radius:16px;padding:22px 18px;margin-bottom:16px; }
    .perf-detail { background:var(--surface);border:1px solid;border-radius:12px;padding:12px 15px;margin-bottom:8px; }

    @media (max-width:900px) {
      .perf-wrap { flex-direction:column; }
      .perf-side { width:100%!important;border-right:none;border-bottom:1px solid var(--border);max-height:250px; }
      .perf-main { padding:18px 15px 40px; }
    }

    @media (max-width:768px) {
      .sidebar { position:fixed!important;z-index:100!important;transform:translateX(-100%);transition:transform 0.25s;width:234px!important; }
      .sidebar.open { transform:translateX(0); }
      .mobile-menu { display:flex!important; }
      .macros-grid { grid-template-columns:1fr!important; }
      .body-wrap { flex-direction:column; }
      .body-svg-col { border-right:none;border-bottom:1px solid var(--border); }
    }
  </style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ══════════════════════════════════════════ MACRO DATA ══ */

const CATEGORIES = ['Tous','Favoris','Cathéters','Intra-osseux','Perfusions','Remplissage','Monitoring','Intubation','Antalgiques N1','Antalgiques N2','Antalgiques N3','Sédation','Antidotes','Cardio & urgence','Neuro','Réanimation','Trauma','Médicaments','Per Os','Urgences','Protocoles PISU','Examens','Questions /qu','Autres'];

const DEFAULT_MACROS = [

  // ── CATHÉTERS ──

  {id:'c2',categorie:'Cathéters',type:'me',titre:'Choix du KT — urgence (vert 18G)',texte:'/me choisit un cathéter vert 18G pour la pose en urgence.',info:'Urgence : cathéter vert 18G.'},

  // ── INTRA-OSSEUX ──

  {id:'p25',categorie:'Protocoles PISU',type:'me',titre:'Nouveau-né — APGAR 10 : peau à peau',texte:'/me met le nouveau-né en peau à peau, prévient l\'hypothermie et surveille l\'APGAR à T+5.',info:'PISU 15.'},
  {id:'p26',categorie:'Protocoles PISU',type:'me',titre:'Nouveau-né — FC < 100 ou apnée',texte:'/me libère les VAS, aspire doucement et ventile au BAVU à l\'air ambiant pendant 30 secondes (20 mvt/min).',info:'PISU 15 : APGAR < 10.'},
  {id:'p27',categorie:'Protocoles PISU',type:'me',titre:'Nouveau-né — FC < 60 à 1 min 30',texte:'/me débute la RCP 3/1 avec le BAVU à l\'O2 (20 mvt/min) et pose un KTIO avec NaCl 100mL en garde veine.',info:'PISU 15.'},
  {id:'p28',categorie:'Protocoles PISU',type:'me',titre:'Nouveau-né — Adrénaline 0,01mg/kg',texte:'/me injecte 0,01mg/kg d\'Adrénaline en IVD, FC toujours < 60 à 2 min 30 de vie.',info:'PISU 15.'},
  {id:'p29',categorie:'Protocoles PISU',type:'me',titre:'Douleur thoracique — O2 si désaturation',texte:'/me pose une VVP avec NaCl 100mL en garde veine, met de l\'O2 pour SpO2 > 94% si désaturation et télétransmet l\'ECG au SAMU.',info:'PISU 13.'},
  {id:'p30',categorie:'Protocoles PISU',type:'me',titre:'Douleur thoracique — patch DSA',texte:'/me place un patch DSA à proximité.',info:'PISU 13 : procédures clopidogrel et ticagrelor.'},
  {id:'p31',categorie:'Protocoles PISU',type:'me',titre:'Douleur — EVA 4 à 7',texte:'/me pose une VVP avec NaCl 500mL en garde veine et perfuse 1g de Paracétamol en IVL.',info:'PISU 12 : puis réévaluation et adaptation de la mobilisation.'},
  {id:'p32',categorie:'Protocoles PISU',type:'me',titre:'Douleur — EVA > 7',texte:'/me pose une VVP avec NaCl 500mL en garde veine et injecte la Morphine puis le Paracétamol 1g en IVL.',info:'PISU 12 : Morphine 2 ou 3mg IVD.'},
  {id:'p33',categorie:'Protocoles PISU',type:'me',titre:'Douleur — Nubain enfant intrarectal',texte:'/me administre 0,4mg/kg de Nubain par voie intrarectale, max 20mg.',info:'PISU 12P : alternative sans VVP, après accord de la régulation.'},

  {id:'ex4',categorie:'Examens',type:'me',titre:'Gaz du sang artériel',texte:'/me ponctionne l\'artère radiale et prélève le gaz du sang.',info:'Acte IDE sur prescription. Soin douloureux.'},
  {id:'ex5',categorie:'Examens',type:'me',titre:'Hémocue',texte:'/me mesure l\'hémoglobine avec l\'Hémocue sur la 3ème goutte de sang.',info:'Normes : homme 14 à 18 g/dL, femme 12 à 16 g/dL. Fiabilité : ± 1 à 2 points, refaire un 2ème examen si anormal.'},

  {id:'rp1',categorie:'Remplissage',type:'me',titre:'Remplissage NaCl 500mL — débit libre',texte:'/me branche une poche de NaCl 500mL en débit libre pour le remplissage.',info:'Remplissage rapide : poche ouverte à fond, à évaluer en titration.'},
  {id:'rp2',categorie:'Remplissage',type:'me',titre:'Remplissage NaCl 500mL sur 10 min',texte:'/me passe une poche de NaCl 500mL en remplissage sur 10 minutes.',info:'Choc hémorragique, intoxication aux fumées (défaillance vitale), métrorragies.'},
  {id:'rp3',categorie:'Remplissage',type:'me',titre:'2ème VVP + NaCl 500mL sur 10 min',texte:'/me pose une 2ème VVP et passe une poche de NaCl 500mL en remplissage sur 10 minutes.',info:'Choc hémorragique avec TAS < 80 mmHg, métrorragies > 500mL.'},
  {id:'rp4',categorie:'Remplissage',type:'me',titre:'Garde veine NaCl 500mL',texte:'/me branche une poche de NaCl 500mL en garde veine (débit minimal).',info:'GV : maintient la VVP perméable.'},
  {id:'rp5',categorie:'Remplissage',type:'me',titre:'Garde veine NaCl 100mL',texte:'/me branche une poche de NaCl 100mL en garde veine (débit minimal).',info:'Douleur thoracique, OAP, KTIO.'},
  {id:'rp6',categorie:'Remplissage',type:'me',titre:'Ringer Lactate 20mL/kg sur 1h (brûlé)',texte:'/me passe du Ringer Lactate à 20mL/kg sur 1 heure.',info:'Brûlure > 10% de surface.'},
  {id:'rp7',categorie:'Remplissage',type:'me',titre:'Ringer Lactate 10 à 20mL/kg (anaphylaxie)',texte:'/me passe du Ringer Lactate à 10 à 20mL/kg selon l\'hypovolémie.',info:'Choc anaphylactique.'},
  {id:'rp8',categorie:'Remplissage',type:'me',titre:'Remplissage sous manchette à pression',texte:'/me met la poche sous manchette à pression pour accélérer le remplissage.',info:'Aussi utile en voie IO.'},
  {id:'rp9',categorie:'Remplissage',type:'me',titre:'Poche en hauteur',texte:'/me suspend la poche en hauteur par rapport au patient.',info:'Sinon demander à un témoin de la tenir.'},
  {id:'rp10',categorie:'Remplissage',type:'me',titre:'Numéroter les poches',texte:'/me numérote la poche pour suivre la quantité de remplissage apportée.',info:''},
  {id:'rp11',categorie:'Remplissage',type:'me',titre:'Réévaluer le remplissage (titration)',texte:'/me réévalue l\'efficacité du remplissage (TA, FC, pouls) avant de passer une nouvelle poche.',info:'Remplissage en titration : évaluer à la fin de chaque poche.'},
  {id:'rp12',categorie:'Remplissage',type:'me',titre:'Remplissage enfant NaCl 20mL/kg sur 10 min',texte:'/me passe du NaCl à 20mL/kg sur 10 minutes.',info:'ACR enfant avec hémorragie.'},
  {id:'rp13',categorie:'Remplissage',type:'me',titre:'Remplissage prudent (insuffisance cardiaque)',texte:'/me limite le remplissage en raison de l\'insuffisance cardiaque et laisse un garde veine.',info:'Ne pas majorer la surcharge.'},
  {id:'sg1',categorie:'Intubation',type:'me',titre:'Kétamine IOT (choc) 2mg/kg',texte:'/me prépare 1 ampoule de Kétamine 250mg dans 10mL (25mg/mL) et injecte 6mL en IVDL (induction : hypnose et analgésie, peu d\'effet sur la tension).',info:'Pour 70kg : 140mg soit 6mL. À choisir face à un état de choc. CI : HTA.'},
  {id:'sg2',categorie:'Sédation',type:'me',titre:'Kétamine analgésie 0,1 à 0,5mg/kg',texte:'/me prépare une seringue de Kétamine 50mg dans 5mL (10mg/mL) et injecte 1,4mL en IVDL (analgésie, possible désorientation et tachycardie).',info:'Pour 70kg : 14mg soit 1,4mL, douleur aiguë en MU. CI : HTA.'},
  {id:'sg3',categorie:'Sédation',type:'me',titre:'Kétamine + Midazolam (acte invasif)',texte:'/me prépare une seringue de 20mL avec 50mg de Kétamine et 2mg de Midazolam ramenés à 20mL de NaCl et injecte 14mL en IVDL (sédation-analgésie pour l\'acte).',info:'2mL/10kg, soit 14mL pour 70kg. Matériel de réanimation prêt, patient scopé : risque de coma et de dépression respiratoire.'},
  {id:'sg4',categorie:'Intubation',type:'me',titre:'Etomidate IOT 0,3mg/kg',texte:'/me prépare 1 ampoule d\'Etomidate 40mg dans 20mL (2mg/mL) et injecte 10mL en IVDL (induction : le patient s\'endort).',info:'Pour 70kg : 21mg soit 10mL.'},
  {id:'sg5',categorie:'Intubation',type:'me',titre:'Propofol IOT 2mg/kg',texte:'/me prépare 1 ampoule de Propofol 200mg dans 20mL (20mg/mL) et injecte 7mL en IVDL (induction : sédation de courte durée).',info:'Pour 70kg : 140mg soit 7mL. Prioritaire si épilepsie. Répercussions hémodynamiques possibles.'},
  {id:'sg6',categorie:'Intubation',type:'me',titre:'Célocurine 1mg/kg',texte:'/me prépare 1 ampoule de Célocurine 100mg avec 8mL de NaCl (10mg/mL) et injecte 7mL en IVD (curarisation : fasciculations, le patient ne respire plus, ballonnage au BAVU).',info:'Pour 70kg : 70mg. JAMAIS sur un patient éveillé.'},
  {id:'sg7',categorie:'Sédation',type:'me',titre:'Midazolam sédation vigile IVD',texte:'/me prépare 1 ampoule de Midazolam 5mg dans 5mL et injecte 2 à 2,5mL (2 à 2,5mg) en IVD (sédation vigile : anxiolyse, somnolence).',info:'CI : état de choc. Risque d\'apnée, d\'hypotension.'},
  {id:'sg8',categorie:'Sédation',type:'me',titre:'Midazolam intranasal',texte:'/me prépare 1 ampoule de Midazolam 5mg/1mL et instille 1mL dans chaque narine (sédation vigile, effet en quelques minutes).',info:'5mg dans chaque narine.'},
  {id:'sg9',categorie:'Sédation',type:'me',titre:'Midazolam IM (état de mal épileptique)',texte:'/me injecte 10mg de Midazolam en IM (arrêt de la crise convulsive).',info:'Pour 70kg : 10mg.'},
  {id:'sg10',categorie:'Antalgiques N3',type:'me',titre:'Morphine 2 à 3mg IVD',texte:'/me prépare 1 ampoule de Morphine 10mg dans 10mL (1mg/mL) et injecte 2 à 3mL en IVD (antalgie, effet en 5 minutes).',info:'En titration. Risque de bradypnée, somnolence, confusion, nausées. Max 10mg (PISU 12).'},
  {id:'sg11',categorie:'Antidotes',type:'me',titre:'Naloxone (Narcan) titration',texte:'/me dilue 1 ampoule de Naloxone 0,4mg dans une seringue de 10mL de NaCl et injecte 1mL (0,04mg) en IVD toutes les 1 à 3 minutes (réveil, reprise de la ventilation, FR > 12/min).',info:'Titrer mL par mL jusqu\'à ventilation spontanée. Frissons, agitation possibles.'},
  {id:'sg12',categorie:'Antidotes',type:'me',titre:'Flumazénil (Anexate) titration',texte:'/me prépare 1 ampoule d\'Anexate 0,5mg dans 5mL (0,1mg/mL) et injecte 1 à 3mL en IVD en titration (réveil franc, arrêt de la dépression respiratoire).',info:'Réévaluer minute par minute. MAX 2mg. Risque de convulsions.'},
  {id:'sg13',categorie:'Cardio & urgence',type:'me',titre:'Adrénaline ACR 1mg',texte:'/me prépare 1 ampoule d\'Adrénaline 5mg dans 5mL et injecte 1mg pur (1mL) en IVD (relance de la contractilité du cœur).',info:'1mg toutes les 4 min, selon la procédure ACR.'},
  {id:'sg14',categorie:'Cardio & urgence',type:'me',titre:'Adrénaline anaphylaxie IM 0,5mg',texte:'/me injecte 0,5mg d\'Adrénaline pure en IM (lutte contre le choc, la bronchoconstriction et l\'œdème).',info:'IM : face supérieure de la cuisse. Max 0,5mg en IM.'},
  {id:'sg15',categorie:'Cardio & urgence',type:'me',titre:'Adrénaline anaphylaxie IVD 0,05mg',texte:'/me dilue 1mg d\'Adrénaline dans une seringue de 10mL de NaCl (0,1mg/mL) et injecte 0,5mL (0,05mg) en IVD toutes les 2 minutes (remontée de la tension, objectif TAS > 80mmHg).',info:'Seconde ligne. Surveiller tachycardie et HTA.'},
  {id:'sg16',categorie:'Cardio & urgence',type:'me',titre:'Amiodarone ACR (TV/FV)',texte:'/me prépare 2 ampoules d\'Amiodarone 150mg/3mL dans une seringue et injecte 6mL (300mg) en IVD (antiarythmique, ralentit la fréquence cardiaque).',info:'Puis 1 ampoule de 150mg. Risque de bradycardie.'},
  {id:'sg17',categorie:'Cardio & urgence',type:'me',titre:'G30% 1 ampoule IVDL',texte:'/me injecte 1 ampoule de G30% 10mL en IVDL (resucrage, hausse de la glycémie).',info:'PISU 7 : contrôle de la glycémie toutes les 5 min. G30 en 2 ampoules = 6g/20mL pur.'},
  {id:'sg18',categorie:'Neuro',type:'me',titre:'Clonazépam (Rivotril) 1mg IVD',texte:'/me dilue 1 ampoule de Rivotril 1mg/mL avec 1mL d\'EPPI et injecte 1mg en IVD (arrêt de la crise convulsive, myorelaxation).',info:'Renouvelable une fois à T+5 min. Risque d\'hypotension, hypotonie.'},
  {id:'sg19',categorie:'Cardio & urgence',type:'me',titre:'Aspégic 250mg IVD (SCA)',texte:'/me dilue 1 flacon d\'Aspégic 500mg avec 10mL d\'EPPI et injecte 5mL (250mg) en IVD (antiagrégant plaquettaire).',info:'Risque hémorragique, allergie, ulcère gastrique.'},
  {id:'sg20',categorie:'Cardio & urgence',type:'me',titre:'Lasilix 1mg/kg IVDL (OAP)',texte:'/me injecte 7mL de Lasilix 10mg/mL (70mg) en IVDL (diurèse, soulagement de l\'œdème pulmonaire).',info:'1mg/kg, max 80mg. Pour 70kg : 70mg.'},
  {id:'sg21',categorie:'Cardio & urgence',type:'me',titre:'Risordan 1mg IVD (OAP)',texte:'/me injecte 1mL de Risordan 1mg/mL (1mg) en IVD, à répéter toutes les 5 min (vasodilatation, baisse de la tension).',info:'Jusqu\'à amélioration ou TA < 120mmHg. Seulement si TAS > 180.'},
  {id:'sg22',categorie:'Cardio & urgence',type:'me',titre:'Solumédrol 1mg/kg IVDL',texte:'/me dilue 1 flacon de Solumédrol 120mg dans 12mL de NaCl (10mg/mL) et injecte 7mL (70mg) en IVDL (corticoïde anti-inflammatoire).',info:'1mg/kg, max 120mg (12mL). Pour 70kg : 70mg.'},
  {id:'cn1',categorie:'Antalgiques N1',type:'me',titre:'Paracétamol 1g IVL',texte:'/me perfuse 1g de Paracétamol (flacon de 1g/100mL) en IVL sur 15 minutes (antalgie et antipyrétique).',info:'Palier 1. Max 4g/jour, toutes les 4 à 6h. CI : insuffisance hépatique. Surdosage : Hidonac.'},
  {id:'cn2',categorie:'Antalgiques N1',type:'me',titre:'Paracétamol per os',texte:'/me donne 1g de Paracétamol per os (2 comprimés de 500mg) (antalgie palier 1).',info:'Max 4g/jour, toutes les 4 à 6h. CI : insuffisance hépatique.'},
  {id:'cn3',categorie:'Antalgiques N1',type:'me',titre:'AINS IVL (Kétoprofène…)',texte:'/me perfuse 1 ampoule d\'AINS (Kétoprofène) selon prescription dans une perfusette de 100mL de NaCl en IVL (antalgie et anti-inflammatoire).',info:'Palier 1, IV ou PO. Attention aux problèmes digestifs.'},
  {id:'cn4',categorie:'Antalgiques N1',type:'me',titre:'Néfopam (Acupan) IVL',texte:'/me perfuse 1 ampoule de Néfopam (Acupan) 20mg selon prescription dans une perfusette de 100mL de NaCl en IVL (antalgie).',info:'Palier 1, IVL ou PO. Attention aux nausées.'},
  {id:'cn5',categorie:'Antalgiques N1',type:'me',titre:'MEOPA 6L/min',texte:'/me pose le masque de MEOPA à 6L/min (antalgie et anxiolyse).',info:'Contre-indications : O² dépendant, TC/HTIC, patient non coopérant ou conscience altérée, OH, trauma thoracique, accident de plongée, état de choc, traumatisme facial, chirurgie oculaire récente, anémie chronique.'},
  {id:'cn6',categorie:'Antalgiques N2',type:'me',titre:'Tramadol per os',texte:'/me donne du Tramadol per os selon prescription (antalgie palier 2).',info:'Palier 2 (Tramadol, codéine) : peu utilisé en SMUR, per os.'},
  {id:'cn7',categorie:'Antalgiques N3',type:'me',titre:'Morphine réinjection 2mg',texte:'/me réinjecte 2mg de Morphine (2mL à 1mg/mL) en IVD, max 10mg au total (antalgie, effet en 5 minutes).',info:'PISU 12 : réinjecter tant que EVA > 7. Surveiller la ventilation.'},
  {id:'cn8',categorie:'Antalgiques N3',type:'me',titre:'Oxynorm 5mg per os',texte:'/me donne 1 comprimé d\'Oxynorm 5mg per os (antalgie palier 3).',info:'Palier 3 : surveiller somnolence et ventilation.'},
  {id:'cn9',categorie:'Neuro',type:'me',titre:'Keppra 40 à 60mg/kg IVL',texte:'/me perfuse du Keppra (40 à 60mg/kg) dilué dans une perfusette de 500mL de NaCl en IVL sur 10 minutes (anticonvulsivant).',info:'État de mal épileptique. Flacons de 500mg : 70kg = 3,5g soit 7 flacons.'},
  {id:'cn10',categorie:'Antidotes',type:'me',titre:'Hidonac 200mg/kg',texte:'/me perfuse 200mg/kg de N-Acétylcystéine (Hidonac) dans 500mL de NaCl en IVL sur 4 heures (antidote du paracétamol).',info:'70kg : 14g soit 3 flacons de 5g/25mL. Nausées, vomissements, allergie possibles.'},
  {id:'cn11',categorie:'Antidotes',type:'me',titre:'Cyanokit 5g',texte:'/me perfuse 1 flacon de Cyanokit 5g dilué dans 200mL de NaCl en IVL sur 15 minutes (antidote du cyanure).',info:'Intoxication aux fumées en milieu clos. Allergie possible, urines rouges pendant 2 à 3 jours.'},

  return <div className="toast-wrap"><div className={`toast-inner ${type==='qu'?'toast-qu':'toast-me'}`} style={{opacity:show?1:0,transform:show?'translateY(0) scale(1)':'translateY(14px) scale(0.94)'}}><Ic.Check/> {msg}</div></div>;
}

/* ══════════════════════════════════════ MACRO CARD ══ */
function MacroCard({macro,isFav,onCopy,onFav,onDelete}){
  const [copied,setCopied]=useState(false);
  const me=isME(macro), isCustom=/^x_/.test(macro.id);
  const handleCopy=async()=>{ await onCopy(macro); setCopied(true); setTimeout(()=>setCopied(false),1700); };
  return(
    <div className={`macro-card ${me?'':'is-qu'} ${copied?(me?'copied-me':'copied-qu'):''}`} onClick={handleCopy} title="Cliquer pour copier">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'8px'}}>
        <div style={{flex:1,minWidth:0}}>
          <span className={me?'chip-me':'chip-qu'}>{me?'/me':'/qu'} · {macro.categorie==='Questions /qu'?'Question':macro.categorie}</span>
          <div style={{fontSize:'13px',fontWeight:700,color:'#e2e8f0',marginTop:'7px',lineHeight:1.4}}>{macro.titre}</div>
        </div>
        <div style={{display:'flex',gap:'2px',flexShrink:0,marginTop:'-2px'}}>
          <button className="fav-btn" onClick={e=>{e.stopPropagation();onFav(macro.id);}} style={{background:'none',border:'none',cursor:'pointer',color:isFav?'#fbbf24':'var(--faint)',padding:'5px',borderRadius:'6px'}}><Ic.Star f={isFav}/></button>
          {isCustom&&<button onClick={e=>{e.stopPropagation();onDelete(macro.id);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--faint)',padding:'5px',borderRadius:'6px',transition:'color 0.15s'}} onMouseEnter={e=>e.currentTarget.style.color='var(--red)'} onMouseLeave={e=>e.currentTarget.style.color='var(--faint)'}><Ic.Trash/></button>}
        </div>
      </div>
      <div style={{fontSize:'11.5px',color:'#334155',fontFamily:'JetBrains Mono,monospace',lineHeight:1.6,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{macro.texte}</div>
      {macro.info&&(
        <div onClick={e=>e.stopPropagation()} style={{fontSize:'10.5px',fontFamily:'JetBrains Mono,monospace',color:'#fbbf24',background:'rgba(251,191,36,0.07)',border:'1px solid rgba(251,191,36,0.18)',borderRadius:'7px',padding:'5px 10px',marginTop:'5px',lineHeight:1.55,userSelect:'text',cursor:'text'}}>
          ⚡ {macro.info}
        </div>
      )}
      <div className="copy-line" style={{color:copied?(me?'var(--me)':'var(--qu)'):'var(--faint)'}}>
        {copied?<Ic.Check/>:<Ic.Copy/>} {copied?`Copié dans le presse-papiers !`:`Copier ce /${me?'me':'qu'}`}
      </div>
    </div>
  );
}

/* ════════════════════════════════════ SHARED UI ══ */
const INP={width:'100%',padding:'10px 13px',borderRadius:'10px',fontSize:'13.5px'};
function Field({label,right,children}){
  return <div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'7px'}}><span style={{fontSize:'10px',fontWeight:800,textTransform:'uppercase',letterSpacing:'0.09em',color:'var(--muted)'}}>{label}</span>{right}</div>{children}</div>;
}
function ModalBtn({children,onClick,ghost,color}){
  const bg=ghost?'transparent':(color==='qu'?'#4c1d95':'#0e5f74');
  return <button onClick={onClick} style={{padding:'10px 22px',borderRadius:'11px',cursor:'pointer',fontSize:'13px',fontWeight:800,background:bg,border:ghost?'1px solid var(--border2)':'none',color:ghost?'var(--muted)':'white',transition:'all 0.15s',fontFamily:'Inter,sans-serif'}} onMouseEnter={e=>e.currentTarget.style.opacity='0.8'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}>{children}</button>;
}

/* ═══════════════════════════════ CREATE MACRO MODAL ══ */
function CreateModal({onClose,onSave}){
  const [form,setForm]=useState({titre:'',categorie:'Cathéters',type:'me',texte:''});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const me=form.type==='me';
  const autoGen=()=>{ if(!form.titre)return; const t=form.titre.charAt(0).toLowerCase()+form.titre.slice(1).replace(/[.!?]$/,''); set('texte',me?`/me ${t}.`:`/qu ${t} ?`); };
  const handleSave=()=>{ if(!form.titre.trim()||!form.texte.trim())return; onSave({id:uid(),...form}); onClose(); };
  const switchType=t=>{ set('type',t); if(t==='qu')set('categorie','Questions /qu'); else if(form.categorie==='Questions /qu')set('categorie','Cathéters'); };
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'22px'}}>
          <h2 style={{fontSize:'17px',fontWeight:900,color:'#f1f5f9'}}>✏️ Créer une macro</h2>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'4px'}}><Ic.X/></button>
        </div>
        <div style={{display:'flex',gap:'8px',marginBottom:'20px'}}>
          {['me','qu'].map(t=>(
            <button key={t} className="type-toggle-btn" onClick={()=>switchType(t)} style={{background:form.type===t?(t==='qu'?'var(--qu-dim)':'var(--me-dim)'):'transparent',color:form.type===t?(t==='qu'?'var(--qu)':'var(--me)'):'var(--muted)',borderColor:form.type===t?(t==='qu'?'var(--qu-border)':'var(--me-border)'):'var(--border2)'}}>
              {t==='me'?'🩺 /me — Action':'💬 /qu — Question'}
            </button>
          ))}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
          <Field label="Titre *"><input type="text" placeholder={me?'Ex: Cathéter 18G bras gauche':'Ex: TA ?'} value={form.titre} onChange={e=>set('titre',e.target.value)} style={INP}/></Field>
          <Field label="Catégorie"><select value={form.categorie} onChange={e=>set('categorie',e.target.value)} style={INP}>{CATEGORIES.filter(c=>c!=='Tous'&&c!=='Favoris').map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label={`Texte /${me?'me':'qu'} *`} right={<button onClick={autoGen} style={{background:me?'var(--me-dim)':'var(--qu-dim)',border:`1px solid ${me?'var(--me-border)':'var(--qu-border)'}`,color:me?'var(--me)':'var(--qu)',cursor:'pointer',borderRadius:'8px',padding:'4px 11px',fontSize:'11px',fontWeight:800,display:'flex',alignItems:'center',gap:'5px',fontFamily:'Inter,sans-serif'}}><Ic.Spark/> Générer</button>}>
            <textarea value={form.texte} onChange={e=>set('texte',e.target.value)} rows={4} style={{...INP,fontFamily:'JetBrains Mono,monospace',fontSize:'12.5px',resize:'vertical',lineHeight:1.6}}/>
          </Field>
        </div>
        <div style={{display:'flex',gap:'10px',marginTop:'24px',justifyContent:'flex-end'}}>
          <ModalBtn ghost onClick={onClose}>Annuler</ModalBtn>
          <ModalBtn color={me?'me':'qu'} onClick={handleSave}>💾 Créer</ModalBtn>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════ PDF IMPORT MODAL ══ */
function PdfModal({onClose,onImport}){
  const [loading,setLoading]=useState(false);
  const [sugg,setSugg]=useState([]);
  const [sel,setSel]=useState(new Set());
  const [cat,setCat]=useState('Autres');
  const [err,setErr]=useState('');
  const [over,setOver]=useState(false);
  const parseText=text=>{
    const lines=text.split(/\n|\. /).map(l=>l.trim()).filter(l=>l.length>18&&l.length<220);
    const res=[];const seen=new Set();
    for(const line of lines){if(seen.has(line))continue;seen.add(line);
      if(line.startsWith('/me '))res.push({titre:line.slice(4,55),texte:line,type:'me'});
      else if(/^(poser|placer|vérifier|administrer|préparer|retirer|fixer|surveiller|mesurer|appliquer|injecter|perfuser|intuber|ventiler|comprimer|prendre|effectuer|réaliser|installer|brancher)/i.test(line)){
        const c=line.replace(/^[•\-–—*·►▶\s]+/,'').trim();
        res.push({titre:c.slice(0,55),texte:'/me '+c.charAt(0).toLowerCase()+c.slice(1).replace(/[.!?]$/,'')+'.', type:'me'});
      }
    }
    return res.slice(0,25);
  };
  const process=async file=>{
    if(!file||file.type!=='application/pdf'){setErr('Veuillez sélectionner un fichier PDF.');return;}
    setLoading(true);setErr('');setSugg([]);
    try{
      const lib=window['pdfjs-dist/build/pdf'];
      lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buf=await file.arrayBuffer();const pdf=await lib.getDocument({data:buf}).promise;
      let text='';
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){const page=await pdf.getPage(i);const c=await page.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n';}
      const list=parseText(text);
      if(!list.length)setErr('Aucune procédure détectée automatiquement.');
      else{setSugg(list);setSel(new Set(list.map((_,i)=>i)));}
    }catch(e){setErr('Erreur lecture PDF : '+e.message);}
    finally{setLoading(false);}
  };
  const toggle=i=>setSel(s=>{const n=new Set(s);n.has(i)?n.delete(i):n.add(i);return n;});
  const doImport=()=>{const items=sugg.filter((_,i)=>sel.has(i)).map(s=>({id:uid(),categorie:s.type==='qu'?'Questions /qu':cat,...s}));onImport(items);onClose();};
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" style={{maxWidth:600,maxHeight:'80vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
          <h2 style={{fontSize:'17px',fontWeight:900,color:'#f1f5f9'}}>📄 Importer un PDF</h2>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'4px'}}><Ic.X/></button>
        </div>
        {!sugg.length&&!loading&&(
          <div className={`drop-zone ${over?'over':''}`} onDrop={e=>{e.preventDefault();setOver(false);process(e.dataTransfer.files[0]);}} onDragOver={e=>{e.preventDefault();setOver(true);}} onDragLeave={()=>setOver(false)} onClick={()=>document.getElementById('_pdfin').click()}>
            <div style={{color:'var(--faint)',marginBottom:14}}><Ic.Pdf/></div>
            <div style={{fontSize:15,fontWeight:700,color:'var(--muted)',marginBottom:6}}>Déposez un PDF ici</div>
            <div style={{fontSize:13,color:'#334155'}}>ou cliquez pour parcourir</div>
            <input id="_pdfin" type="file" accept=".pdf" style={{display:'none'}} onChange={e=>process(e.target.files[0])}/>
          </div>
        )}
        {loading&&<div style={{textAlign:'center',padding:32,color:'var(--me)',fontSize:14}}>⏳ Analyse en cours…</div>}
        {err&&<div style={{background:'rgba(244,63,94,0.08)',border:'1px solid rgba(244,63,94,0.25)',color:'#fda4af',padding:'12px 16px',borderRadius:10,fontSize:13}}>{err}</div>}
        {sugg.length>0&&<>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <span style={{fontSize:13,fontWeight:800,color:'var(--muted)'}}>{sugg.length} procédure(s) détectée(s)</span>
            <select value={cat} onChange={e=>setCat(e.target.value)} style={{padding:'4px 8px',borderRadius:7,fontSize:12}}>{CATEGORIES.filter(c=>c!=='Tous'&&c!=='Favoris'&&c!=='Questions /qu').map(c=><option key={c}>{c}</option>)}</select>
          </div>
          <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:7,marginBottom:16}}>
            {sugg.map((s,i)=>(
              <div key={i} onClick={()=>toggle(i)} style={{background:sel.has(i)?'var(--me-dim)':'rgba(255,255,255,0.02)',border:`1px solid ${sel.has(i)?'var(--me-border)':'var(--border)'}`,borderRadius:9,padding:'10px 14px',cursor:'pointer'}}>
                <div style={{fontSize:11.5,fontFamily:'JetBrains Mono',color:sel.has(i)?'var(--text)':'var(--muted)'}}>{sel.has(i)?'✓ ':'○ '}{s.texte}</div>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <ModalBtn ghost onClick={onClose}>Annuler</ModalBtn>
            <ModalBtn onClick={doImport}>Importer {sel.size} macro(s)</ModalBtn>
          </div>
        </>}
      </div>
    </div>
  );
}

/* ══════════════════════════════ GENERATE MODAL ══ */
function GenerateModal({onClose,onAdd}){
  const [desc,setDesc]=useState('');
  const [type,setType]=useState('me');
  const [cat,setCat]=useState('Autres');
  const [results,setResults]=useState([]);
  const [sel,setSel]=useState(new Set());
  const generate=()=>{
    if(!desc.trim())return;
    const l=desc.trim(),lo=l.charAt(0).toLowerCase()+l.slice(1).replace(/[.!?]$/,'');
    const list=type==='me'?[`/me prépare le matériel puis procède à ${lo}.`,`/me ${lo} en asepsie.`,`/me ${lo} puis note l\'heure dans le dossier.`,`/me vérifie les constantes avant de ${lo}.`]:[`/qu ${lo.charAt(0).toUpperCase()+lo.slice(1)} ?`,`/qu Pouvez-vous me préciser ${lo} ?`,`/qu Avez-vous des informations concernant ${lo} ?`];
    setResults(list);setSel(new Set([0]));
  };
  const toggle=i=>setSel(s=>{const n=new Set(s);n.has(i)?n.delete(i):n.add(i);return n;});
  const doAdd=()=>{const macros=results.filter((_,i)=>sel.has(i)).map(texte=>({id:uid(),categorie:type==='qu'?'Questions /qu':cat,type,titre:desc.slice(0,55),texte}));onAdd(macros);onClose();};
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'22px'}}>
          <h2 style={{fontSize:'17px',fontWeight:900,color:'#f1f5f9'}}>✨ Générer des macros</h2>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'4px'}}><Ic.X/></button>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          {['me','qu'].map(t=>(
            <button key={t} onClick={()=>{setType(t);setResults([]);}} style={{flex:1,padding:'9px',borderRadius:10,border:`1px solid ${type===t?(t==='qu'?'var(--qu-border)':'var(--me-border)'):'var(--border2)'}`,cursor:'pointer',fontWeight:800,fontSize:12.5,background:type===t?(t==='qu'?'var(--qu-dim)':'var(--me-dim)'):'transparent',color:type===t?(t==='qu'?'var(--qu)':'var(--me)'):'var(--muted)',fontFamily:'Inter,sans-serif'}}>
              {t==='me'?'🩺 /me Action':'💬 /qu Question'}
            </button>
          ))}
        </div>
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <input type="text" placeholder={type==='me'?'Ex: pose d\'un cathéter 18G':'Ex: voie passe'} value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==='Enter'&&generate()} style={{...INP,flex:1}}/>
          <button onClick={generate} style={{background:'linear-gradient(135deg,#0891b2,#4f46e5)',border:'none',color:'white',padding:'10px 16px',borderRadius:10,cursor:'pointer',fontSize:13,fontWeight:800,display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap',fontFamily:'Inter,sans-serif'}}><Ic.Wand/> Générer</button>
        </div>
        {results.length>0&&<>
          {type==='me'&&<Field label="Catégorie" style={{marginBottom:14}}><select value={cat} onChange={e=>setCat(e.target.value)} style={INP}>{CATEGORIES.filter(c=>c!=='Tous'&&c!=='Favoris'&&c!=='Questions /qu').map(c=><option key={c}>{c}</option>)}</select></Field>}
          <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:18}}>
            {results.map((r,i)=>(
              <div key={i} onClick={()=>toggle(i)} style={{background:sel.has(i)?(type==='qu'?'var(--qu-dim)':'var(--me-dim)'):'rgba(255,255,255,0.02)',border:`1px solid ${sel.has(i)?(type==='qu'?'var(--qu-border)':'var(--me-border)'):'var(--border)'}`,borderRadius:9,padding:'11px 14px',cursor:'pointer',fontSize:12.5,fontFamily:'JetBrains Mono',color:sel.has(i)?'var(--text)':'var(--muted)'}}>
                {sel.has(i)?'✓ ':'○ '}{r}
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <ModalBtn ghost onClick={onClose}>Annuler</ModalBtn>
            <ModalBtn color={type} onClick={doAdd}>Ajouter {sel.size} macro(s)</ModalBtn>
          </div>
        </>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════ BODY SCHEMA ══ */
function ZoneShape({zoneId,isSelected,isHovered,onSelect,onHover}){
  const zone=ZONES.find(z=>z.id===zoneId);
  const sh=SVG_SHAPES[zoneId];
  if(!zone||!sh)return null;
  const color=getZoneColor(zone);

  // ── Label anatomique (os IO) ──
  if(sh.s==='label'){
    const isRight=sh.lx>100;
    const W=sh.w||68; // largeur label (défaut 68)
    const lineEndX=isRight?sh.lx:sh.lx+W;
    const lineEndY=sh.ly+7;
    const active=isSelected||isHovered;
    return(
      <g style={{cursor:'pointer'}} onClick={()=>onSelect(zoneId)} onMouseEnter={()=>onHover(zoneId)} onMouseLeave={()=>onHover(null)}>
        {/* Trait */}
        <line x1={sh.bx} y1={sh.by} x2={lineEndX} y2={lineEndY} stroke={active?color+'dd':color+'55'} strokeWidth={1}/>
        {/* Point sur l'os */}
        <circle cx={sh.bx} cy={sh.by} r={isSelected?5:isHovered?4:3}
          fill={isSelected?color+'cc':isHovered?color+'88':color+'44'}
          stroke={color} strokeWidth={isSelected?2:1.5}
          style={{transition:'all 0.13s'}}/>
        {/* Boîte label */}
        <rect x={sh.lx} y={sh.ly} width={W} height={15} rx={3}
          fill={isSelected?color+'20':isHovered?color+'10':'rgba(6,13,26,0.92)'}
          stroke={isSelected?color:active?color+'88':color+'44'}
          strokeWidth={isSelected?1.5:1}/>
        {/* Texte */}
        <text x={sh.lx+W/2} y={sh.ly+10.5} textAnchor="middle"
          fill={isSelected?color:isHovered?color:color+'bb'}
          fontSize="7.5" fontWeight="700" fontFamily="Inter,sans-serif" letterSpacing="0.3">
          🦴 {sh.label}
        </text>
      </g>
    );
  }

  const fill=isSelected?color+'55':isHovered?color+'33':color+'18';
  const stroke=isSelected?color:isHovered?color+'cc':color+'44';
  const strokeWidth=isSelected?2.5:isHovered?1.8:1.2;
  const common={fill,stroke,strokeWidth,style:{cursor:'pointer',transition:'all 0.13s ease'},onClick:()=>onSelect(zoneId),onMouseEnter:()=>onHover(zoneId),onMouseLeave:()=>onHover(null)};
  if(sh.s==='circle') return <circle cx={sh.cx} cy={sh.cy} r={sh.r} {...common}/>;
  if(sh.s==='ellipse') return <ellipse cx={sh.cx} cy={sh.cy} rx={sh.rx} ry={sh.ry} {...common}/>;
  if(sh.s==='rect') return <rect x={sh.x} y={sh.y} width={sh.w} height={sh.h} rx={sh.rx||0} {...common}/>;
  if(sh.s==='path') return <path d={sh.d} {...common}/>;
  return null;
}

function BodySchema({showToast}){
  const [selZone,setSelZone]=useState(null);
  const [hovZone,setHovZone]=useState(null);
  const [copiedAction,setCopiedAction]=useState(null);

  const zone=selZone?ZONES.find(z=>z.id===selZone):null;
  const actions=zone?ACTION_TEMPLATES.filter(a=>a.ptype.some(t=>zone.ptype.includes(t))):[];

  const copyAction=async(action)=>{
    const text=action.fn(zone.prep);
    try{await navigator.clipboard.writeText(text);}
    catch{const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();}
    setCopiedAction(action.id);
    showToast('/me copié !','me');
    setTimeout(()=>setCopiedAction(null),1600);
  };

  const zoneIds=Object.keys(SVG_SHAPES);

  return(
    <div className="body-wrap">

      {/* ── SVG BODY ── */}
      <div className="body-svg-col" style={{width:260}}>
        <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--muted)',marginBottom:10,textAlign:'center'}}>
          Vue frontale — Cliquer sur une zone
        </div>
        <div style={{fontSize:9,color:'#334155',textAlign:'center',marginBottom:14}}>
          ← Droite patient · Gauche patient →
        </div>

        <svg viewBox="0 0 200 440" width="220" style={{overflow:'visible'}}>
          {/* Body outline (decorative) */}
          <ellipse cx="100" cy="33" rx="30" ry="30" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
          <rect x="28" y="74" width="144" height="2" fill="none"/>

          {/* All zones */}
          {zoneIds.map(id=>(
            <ZoneShape key={id} zoneId={id} isSelected={selZone===id} isHovered={hovZone===id} onSelect={setSelZone} onHover={setHovZone}/>
          ))}

          {/* Hover label */}
          {hovZone&&SVG_SHAPES[hovZone]&&(()=>{
            const sh=SVG_SHAPES[hovZone];
            const z=ZONES.find(z=>z.id===hovZone);
            const color=getZoneColor(z);
            const cx=sh.cx||(sh.x!=null?sh.x+(sh.w||0)/2:100);
            const cy=sh.cy||(sh.y!=null?sh.y-8:50);
            return(
              <g>
                <rect x={cx-36} y={cy-18} width={72} height={16} rx={4} fill="#0a1628" stroke={color+'88'} strokeWidth={1}/>
                <text x={cx} y={cy-7} textAnchor="middle" fill={color} fontSize="9" fontWeight="800" fontFamily="Inter,sans-serif">{z?.label}</text>
              </g>
            );
          })()}
        </svg>

/* ════════════════════════════════ PROCÉDURES GUIDÉES ══ */
function ProceduresView({ showToast }) {
  const [selProc, setSelProc] = useState(null);
  const [currentStep, setCurrentStep] = useState(0);
  const [doneSteps, setDoneSteps] = useState(new Set());

  const proc = selProc ? PROCEDURES.find(p => p.id === selProc) : null;

  const selectProc = id => { setSelProc(id); setCurrentStep(0); setDoneSteps(new Set()); };
  const reset = () => { setCurrentStep(0); setDoneSteps(new Set()); };

  const copyText = async text => {
    try { await navigator.clipboard.writeText(text); }
    catch { const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove(); }
  };

  const copyAndAdvance = async () => {
    if (!proc) return;
    await copyText(proc.etapes[currentStep].texte);
    const nd = new Set(doneSteps); nd.add(currentStep); setDoneSteps(nd);
    showToast(`/me copié — étape ${currentStep+1} ✓`, 'me');
    if (currentStep < proc.etapes.length - 1) setCurrentStep(currentStep + 1);
  };

  const copyStep = async idx => {
    if (!proc) return;
    await copyText(proc.etapes[idx].texte);
    const nd = new Set(doneSteps); nd.add(idx); setDoneSteps(nd);
    showToast('/me copié !', 'me');
  };

  const progress = proc ? (doneSteps.size / proc.etapes.length) * 100 : 0;
  const allDone = proc && doneSteps.size === proc.etapes.length;

  return (
    <div style={{display:'flex',flex:1,overflow:'hidden',minHeight:0}}>

      {/* ── LEFT: Procedure list ── */}
      <div style={{width:310,flexShrink:0,background:'var(--bg2)',borderRight:'1px solid var(--border)',overflowY:'auto',padding:'18px 12px'}}>
        <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--muted)',marginBottom:13,padding:'0 4px'}}>
          {PROCEDURES.length} procédures guidées
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:7}}>
          {PROCEDURES.map(p => {
            const isAct = selProc === p.id;
            const doneCt = isAct ? doneSteps.size : 0;
            return (
              <div key={p.id} className="proc-card" onClick={() => selectProc(p.id)}
                style={{borderColor:isAct?p.color+'55':'var(--border)',background:isAct?p.color+'0d':'var(--surface)',transform:isAct?'translateX(3px)':''}}>
                <div style={{position:'absolute',left:0,top:0,bottom:0,width:4,borderRadius:'2px 0 0 2px',background:p.color,opacity:isAct?1:0.28}}/>
                <div style={{paddingLeft:10}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                    <span style={{fontSize:17}}>{p.icon}</span>
                    <span style={{fontSize:12.5,fontWeight:800,color:isAct?'#f1f5f9':'#94a3b8',lineHeight:1.3}}>{p.titre}</span>
                  </div>
                  <div style={{fontSize:10.5,color:'#475569',lineHeight:1.4,marginBottom:6}}>{p.desc}</div>
                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                    <span style={{fontSize:10,fontWeight:700,color:p.color,opacity:0.85}}>{p.etapes.length} étapes</span>
                    {isAct && doneCt > 0 && <span style={{fontSize:10,color:'#34d399',fontWeight:700}}>· {doneCt}/{p.etapes.length} faites</span>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── RIGHT: Step view ── */}
      <div style={{flex:1,overflowY:'auto',padding:'24px 28px'}}>
        {!proc ? (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',textAlign:'center',padding:40}}>
            <div style={{fontSize:58,marginBottom:16}}>🗂️</div>
            <div style={{fontSize:18,fontWeight:800,color:'#475569',marginBottom:8}}>Sélectionne une procédure</div>
            <div style={{fontSize:13,color:'#334155',lineHeight:1.7,maxWidth:360}}>Chaque procédure guide pas à pas les actions dans le bon ordre — tu dois poser le cathéter avant de le retirer.</div>
          </div>
        ) : (
          <>
            {/* Header */}
            <div style={{marginBottom:22}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,marginBottom:14}}>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
                    <span style={{fontSize:26}}>{proc.icon}</span>
                    <h2 style={{fontSize:21,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em'}}>{proc.titre}</h2>
                  </div>
                  <div style={{fontSize:12,color:'var(--muted)',marginLeft:36}}>{proc.desc}</div>
                </div>
                <button onClick={reset} style={{background:'var(--surface)',border:'1px solid var(--border)',color:'var(--muted)',padding:'7px 14px',borderRadius:9,cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'Inter,sans-serif',flexShrink:0,transition:'all 0.15s'}} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border2)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>

            {/* Steps */}
            <div style={{marginBottom:18}}>

                return (

                      <div className={`step-num ${st}`} style={{marginTop:1,fontSize:isDone?12:10}}>

                      <div style={{flex:1,minWidth:0}}>

                          {step.titre}

                        <div style={{fontSize:11,fontFamily:'JetBrains Mono,monospace',color:isDone?'rgba(52,211,153,0.45)':isCurr?'rgba(34,211,238,0.75)':'#334155',lineHeight:1.65,padding:'7px 10px',background:'rgba(0,0,0,0.18)',borderRadius:7}}>
                          {step.texte}
                        </div>

                    </div>
                  </div>

              })}
            </div>

            {/* CTA */}
            {allDone ? (
              <div style={{textAlign:'center',padding:'22px 20px',background:'rgba(52,211,153,0.06)',border:'1px solid rgba(52,211,153,0.2)',borderRadius:14}}>
                <div style={{fontSize:30,marginBottom:8}}>✅</div>
                <div style={{fontSize:15,fontWeight:800,color:'#34d399',marginBottom:4}}>Procédure terminée !</div>
                <div style={{fontSize:12,color:'#475569',marginBottom:14}}>Toutes les étapes ont été complétées.</div>
                <button onClick={reset} style={{background:'rgba(52,211,153,0.12)',border:'1px solid rgba(52,211,153,0.3)',color:'#34d399',padding:'9px 22px',borderRadius:10,cursor:'pointer',fontSize:13,fontWeight:800,fontFamily:'Inter,sans-serif'}}>

              <button className="copy-next-btn" onClick={copyAndAdvance}

                <span style={{fontSize:15}}>📋</span>

            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════ PERFUSION — ATELIER & EXAMEN ══ */

const nf = (n,d=2) => {
  if(!isFinite(n)||isNaN(n)) return '—';
  const r = Math.round(n*Math.pow(10,d))/Math.pow(10,d);
  return String(r).replace('.',',');
};
const heureNow = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0'); };
const getSolv = id => PERF_SOLVANTS.find(s=>s.id===id);
const getDrug = id => PERF_DRUGS.find(d=>d.id===id);
const defaultSolv = d => {
  if(d.solvOk.length===1 && d.solvOk[0]==='pur') return 'pur';
  const a = PERF_SOLVANTS.find(x=>x.base===d.solvIdeal && x.vol===d.volStd);
  if(a) return a.id;
  const b = PERF_SOLVANTS.find(x=>x.base===d.solvIdeal);
  return b ? b.id : null;
};
const isFluide = d => !!d && d.unit==='mL';
const pretEmploi = d => !!d && d.solvOk.length===1 && d.solvOk[0]==='pur';
const volFinal = (drug,solv,volSel) => {
  if(!solv) return 0;
  if(drug.volOptions && volSel && drug.volOptions.includes(volSel)) return volSel;
  return solv.base==='pur' ? (drug.volPur||drug.volStd) : solv.vol;
};

/* Calcul du débit */
function perfCalc(drug, qte, vol, dose, poids){
  const conc = vol>0 ? qte/vol : 0;
  let mlh = 0;
  if(conc>0){
    switch(drug.mode){
      case 'gkm': mlh = (dose*poids*60)/(conc*1000); break;
      case 'gkh': mlh = (dose*poids)/conc;           break;
      case 'mkh': mlh = (dose*poids)/conc;           break;
      case 'mgh': mlh = dose/conc;                   break;
      case 'uih': mlh = dose/conc;                   break;
      case 'duree': mlh = dose>0 ? vol/(dose/60) : 0; break;
      default: mlh = 0;
    }
  }
  return { conc, mlh, gttes: mlh/3, auto: mlh>0 ? vol/mlh : 0 };
}

/* Compatibilité solvant */
function checkSolvant(drug, solv){
  if(!drug||!solv) return null;
  if(solv.base==='pur' && !drug.purOk)
    return `${drug.nom} ne s’administre jamais pur : il faut le diluer avant perfusion.`;
  if(solv.base!=='pur' && !drug.solvOk.includes(solv.base)){
    if(drug.solvNo && drug.solvNo[solv.base]) return drug.solvNo[solv.base];
    return `${drug.nom} ne se dilue pas dans du ${BASE_NOM[solv.base]} — solvant(s) validé(s) : ${drug.solvOk.map(b=>BASE_NOM[b]).join(', ')}.`;
  }
  if(solv.base==='pur' && drug.purOk && drug.solvOk.includes('pur')) return null;
  return null;
}

/* Alertes de sécurité sur la prescription montée */
function checkPresc(drug, qte, vol, dose, poids, r){
  const out = [];
  if(drug.mode!=='duree'){
    if(dose < drug.dmin) out.push({lvl:'warn', txt:`Dose sous la fourchette habituelle (${nf(drug.dmin,3)}–${nf(drug.dmax,3)} ${drug.dunit}) — effet probablement insuffisant.`});
    if(dose > drug.dmax) out.push({lvl:'err',  txt:`SURDOSAGE : au-dessus de la dose maximale de ${nf(drug.dmax,3)} ${drug.dunit}.`});
  } else {
    if(dose < drug.dmin) out.push({lvl:'err',  txt:`Passage trop rapide : le protocole impose au minimum ${drug.dmin} minutes.`});
    if(dose > drug.dmax) out.push({lvl:'warn', txt:`Passage très lent (> ${drug.dmax} min) — retard thérapeutique.`});
  }
  if(drug.id==='p_kcl'){
    const gh = (qte/vol)*r.mlh;
    if(gh > 1.02) out.push({lvl:'err', txt:`${nf(gh,2)} g de KCl par heure — le maximum en voie périphérique est de 1 g/h. Ralentir ou diluer davantage.`});
  }
  if(isFluide(drug) && poids>0){
    const mlkg = vol/poids;
    if(mlkg > 22) out.push({lvl:'warn', txt:`${nf(mlkg,1)} mL/kg d’un coup : c’est beaucoup pour un seul passage. Réévaluer la tolérance (auscultation, SpO2) avant de poursuivre.`});
  }
  const isSe = vol <= 50;
  if(isSe && r.mlh > 999) out.push({lvl:'err', txt:`Débit de ${nf(r.mlh,0)} mL/h : impossible à régler sur un pousse-seringue (max 999 mL/h). Revoir la dilution.`});
  if(!isSe && r.mlh > 900) out.push({lvl:'warn', txt:`${nf(r.mlh,0)} mL/h : au-delà de ce qu’une perfusion par gravité peut délivrer — il faut une poche à pression ou un accélérateur de perfusion.`});
  if(r.mlh > 0 && r.mlh < 0.5) out.push({lvl:'warn', txt:`Débit très faible (${nf(r.mlh,2)} mL/h) : préparation trop concentrée, la titration sera imprécise.`});
  if(isSe && drug.mode!=='duree' && r.mlh > 60) out.push({lvl:'warn', txt:`À ${nf(r.mlh,1)} mL/h, la seringue de ${vol} mL est vide en ${nf(r.auto,1)} h — préparer le relais à l’avance.`});
  return out;
}

/* Génération des /me */
function perfMe(drug, solv, qte, vol, dose, poids, r){
  const u = drug.unit;
  const fluide = isFluide(drug);
  const useSe = !!solv.se && vol<=50 && !fluide;
  const ligne  = drug.sang ? 'un transfuseur muni d’un filtre' : (useSe ? 'un prolongateur' : 'une tubulure de perfusion');
  const appareil = drug.sang ? 'du transfuseur' : 'du perfuseur';
  const nomCourt = drug.nom.split('—')[0].trim();
  const dilTxt = solv.base==='pur' ? `sans dilution, tel quel` : `dans ${nf(vol,0)} mL de ${BASE_NOM[solv.base]}`;
  const contenant = useSe ? (vol<=20?'une seringue de 20 mL':'une seringue de 50 mL') : `une poche de ${nf(vol,0)} mL`;
  const conc = `${nf(r.conc,3)} ${u}/mL`;

  const FLOW_DOC = {p_perfa:'en IVL sur 15 minutes',p_exacyl:'en IVL sur 20 minutes',p_cordar:'en IVL sur 15 minutes',p_nacl_rempl:'sur 10 minutes (remplissage) ou en garde veine',p_rl_rempl:'à 20mL/kg sur 1 heure (brûlé)',p_hypno:'à la seringue électrique, entre 2,5 et 10 mL/h',p_sufe:'à la seringue électrique, entre 0,8 et 20 mL/h',p_hepa:'en IVL',p_g30:'en IVDL'};
  const flow = FLOW_DOC[drug.id] || (useSe ? 'à la seringue électrique, débit selon la prescription' : 'débit selon la prescription');
  return {
    verif: fluide
      ? `/me contrôle la poche de ${nomCourt}.`
      : `/me vérifie l’ampoule de ${drug.nom} (${drug.amp}).`,
    prep: fluide
      ? `/me suspend la poche de ${nomCourt} à la potence.`
      : solv.base==='pur'
        ? `/me prépare ${drug.nom} pur : ${nf(qte,2)} ${u} pour ${nf(vol,0)} mL (${conc}).`
        : `/me prélève ${nf(qte,2)} ${u} de ${drug.nom} et l’injecte ${dilTxt} pour ${contenant} de ${nf(vol,0)} mL à ${conc}.`,
    etiq: fluide
      ? `/me numérote la poche et note l’heure de pose.`
      : `/me étiquette ${useSe?'la seringue':'la poche'} : « ${drug.nom} — ${nf(qte,2)} ${u} / ${nf(vol,0)} mL — ${conc} — ${heureNow()} ».`,
    purge: `/me connecte ${ligne} à ${fluide?'la poche':'la préparation'} et purge la ligne.`,
    branch: `/me connecte la ligne de ${nomCourt} sur la voie veineuse.`,
    debit: `/me passe ${fluide?'la poche':nomCourt} ${flow}.`,
    surv: `/me note l’heure de début, le produit et le passage (${flow}).`,
  };
}
