    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      --gold:#fbbf24; --red:#f43f5e; --green:#34d399;

    ::-webkit-scrollbar { width:4px; height:4px; }

    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:99px; }
    ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.15); }

    .sidebar { background:var(--bg2); border-right:1px solid var(--border); position:relative; }
    .sidebar::before { content:''; position:absolute; top:0;left:0;right:0;height:200px; background:radial-gradient(ellipse at top left,rgba(34,211,238,0.07),transparent 70%); pointer-events:none; }
    .logo-icon { width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0891b2,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 0 20px rgba(8,145,178,0.4); }
    .vlife-logo-bar { background:#000;padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden; }
    .vlife-logo-bar::after { content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,0.18),transparent); }

    .cat-btn { width:100%;text-align:left;padding:8px 12px;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:500;background:transparent;color:var(--muted);transition:all 0.14s ease;margin-bottom:2px;position:relative; }
    .cat-btn:hover { background:var(--surface);color:var(--text); }
    .cat-btn.active { background:rgba(34,211,238,0.08);color:var(--me);font-weight:700; }
    .cat-btn.active::before { content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:99px;background:var(--me); }
    .cat-btn.active-qu { background:var(--qu-dim);color:var(--qu);font-weight:700; }
    .cat-btn.active-qu::before { background:var(--qu); }
    .cat-btn.active-body { background:rgba(251,191,36,0.08);color:var(--gold);font-weight:700; }
    .cat-btn.active-body::before { background:var(--gold); }

    .badge { font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--faint);color:var(--muted);min-width:22px;text-align:center;font-family:'JetBrains Mono',monospace;transition:all 0.14s; }
    .cat-btn.active .badge { background:rgba(255,255,255,0.08);color:var(--me); }
    .cat-btn.active-qu .badge { background:rgba(255,255,255,0.08);color:var(--qu); }
    .cat-btn.active-body .badge { background:rgba(255,255,255,0.08);color:var(--gold); }

    .macro-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px;cursor:pointer;transition:all 0.18s ease;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden; }
    .macro-card::after { content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.18s;background:linear-gradient(135deg,rgba(34,211,238,0.04),transparent 60%); }
    .macro-card:hover { border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4); }
    .macro-card:hover::after { opacity:1; }
    .macro-card:active { transform:scale(0.99); }
    .macro-card.is-qu::after { background:linear-gradient(135deg,rgba(167,139,250,0.05),transparent 60%); }
    .macro-card.is-qu:hover { border-color:rgba(167,139,250,0.2); }
    .macro-card.copied-me { border-color:rgba(34,211,238,0.4)!important;background:rgba(34,211,238,0.06)!important; }
    .macro-card.copied-qu { border-color:rgba(167,139,250,0.4)!important;background:rgba(167,139,250,0.06)!important; }

    .chip-me { display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;padding:3px 9px;border-radius:6px;background:var(--me-dim);color:var(--me);border:1px solid var(--me-border);font-family:'JetBrains Mono',monospace; }
    .chip-qu { display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;padding:3px 9px;border-radius:6px;background:var(--qu-dim);color:var(--qu);border:1px solid var(--qu-border);font-family:'JetBrains Mono',monospace; }

    input,textarea,select { background:rgba(255,255,255,0.04)!important;color:var(--text)!important;border:1px solid var(--border2)!important;outline:none!important;transition:border-color 0.15s,box-shadow 0.15s!important;font-family:'Inter',sans-serif!important; }
    input:focus,textarea:focus,select:focus { border-color:var(--me)!important;box-shadow:0 0 0 3px rgba(34,211,238,0.1)!important; }
    select option { background:#0d1b2e; }

    .modal-bg { position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.18s ease; }
    .modal-box { background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:28px;width:100%;max-width:540px;box-shadow:0 40px 100px rgba(0,0,0,0.8);animation:slideUp 0.2s ease;position:relative;overflow:hidden; }
    .modal-box::before { content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,0.4),transparent); }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(18px) scale(0.97)}to{opacity:1;transform:none} }

    .toast-wrap { position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none; }
    .toast-inner { padding:11px 22px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,0.6);white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .toast-me { background:#022c22;border:1px solid rgba(34,211,238,0.35);color:#6ee7b7; }
    .toast-qu { background:#1e1040;border:1px solid rgba(167,139,250,0.35);color:#c4b5fd; }

    .drop-zone { border:2px dashed var(--border2);border-radius:14px;padding:50px 24px;text-align:center;cursor:pointer;transition:all 0.2s; }
    .drop-zone:hover,.drop-zone.over { border-color:var(--me);background:var(--me-dim); }

    .action-btn { width:100%;padding:9px 13px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--muted);transition:all 0.15s;margin-bottom:6px;font-family:'Inter',sans-serif; }
    .action-btn:hover { transform:translateX(3px);color:var(--text);border-color:var(--border2); }

    .fav-btn { transition:transform 0.2s; }
    .fav-btn:hover { transform:scale(1.4); }

    .topbar { border-bottom:1px solid var(--border);background:var(--bg2);padding:11px 20px;display:flex;align-items:center;gap:10px;position:relative;min-height:56px; }
    .topbar::after { content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,0.12),transparent); }
    .topbar::before { content:'SAMU 93 · vLifeRoleplay';position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.08);font-family:'JetBrains Mono',monospace;pointer-events:none; }

    .create-btn { background:linear-gradient(135deg,#0891b2,#4f46e5);border:none;color:white;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(8,145,178,0.25);transition:all 0.15s;font-family:'Inter',sans-serif;white-space:nowrap; }
    .create-btn:hover { transform:translateY(-1px);box-shadow:0 6px 28px rgba(8,145,178,0.4); }

    .section-label { font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:9px;padding:0 4px; }
    .key-tag { background:rgba(255,255,255,0.05);border:1px solid var(--border2);padding:1px 7px;border-radius:5px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace; }

    .type-toggle-btn { flex:1;padding:10px;border-radius:10px;border:1px solid var(--border2);cursor:pointer;font-size:12.5px;font-weight:800;transition:all 0.15s;font-family:'Inter',sans-serif; }
    .copy-line { display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-top:2px;transition:color 0.2s; }

    /* ─── BODY SCHEMA ─── */
    .body-wrap { display:flex;flex:1;overflow:hidden;min-height:0; }
    .body-svg-col { display:flex;flex-direction:column;align-items:center;padding:16px 12px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0; }
    .body-actions-col { flex:1;overflow-y:auto;padding:20px; }

    .zone-shape { cursor:pointer;transition:all 0.14s ease; }
    .zone-shape:hover { filter:brightness(1.4); }

    .action-card { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;margin-bottom:8px; }
    .action-card:hover { border-color:var(--border2);transform:translateX(3px); }
    .action-card:active { transform:scale(0.99); }
    .action-card.copied { border-color:rgba(34,211,238,0.4);background:rgba(34,211,238,0.06); }

    .zone-pill { display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:0.04em; }

    /* ─── PROCÉDURES ─── */
    .proc-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;transition:all 0.17s ease;position:relative;overflow:hidden; }
    .proc-card:hover { transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4); }
    .proc-card::before { content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px 0 0 2px; }

    .step-item { border-radius:12px;padding:12px 15px;margin-bottom:7px;cursor:pointer;transition:all 0.15s;border:1px solid;position:relative; }
    .step-item.done { background:rgba(52,211,153,0.06);border-color:rgba(52,211,153,0.2); }
    .step-item.current { border-color:var(--me);background:var(--me-dim);box-shadow:0 0 20px rgba(34,211,238,0.08); }
    .step-item.pending { background:var(--surface);border-color:var(--border); }
    .step-item.current:hover { box-shadow:0 0 28px rgba(34,211,238,0.15); }
    .step-item.pending:hover { border-color:var(--border2); }

    .step-num { width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0; }
    .step-num.done { background:rgba(52,211,153,0.2);color:#34d399; }
    .step-num.current { background:var(--me-dim);color:var(--me);border:1.5px solid var(--me); }
    .step-num.pending { background:var(--faint);color:var(--muted); }

    .prog-bar-outer { height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin:8px 0 14px; }

    /* ─── PERFUSION ─── */
    .perf-wrap { display:flex;flex:1;overflow:hidden;min-height:0; }

    .perf-main { flex:1;overflow-y:auto;padding:22px 26px 40px; }

    .perf-modebar { display:flex;gap:9px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap; }
    .perf-modebtn { display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s; }
    .perf-modebtn:hover { border-color:var(--border2);color:#cbd5e1; }

    .perf-panel { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px; }
    .perf-lbl { font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:9px;padding-left:3px; }
    .perf-note { background:rgba(34,211,238,0.05);border:1px solid rgba(34,211,238,0.16);border-radius:12px;padding:13px 16px;font-size:11.5px;color:#94a3b8;line-height:1.7; }
    .perf-note b { color:#22d3ee; }
    .perf-empty { text-align:center;color:#334155;font-size:12.5px;padding:36px 20px;line-height:1.7; }

    .perf-chip { padding:6px 12px;border-radius:99px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.14s;white-space:nowrap; }
    .perf-chip:hover { border-color:var(--me);color:var(--me); }

    .perf-drug-card { border-radius:12px;padding:11px 13px;cursor:pointer;transition:all 0.15s; }
    .perf-drug-card:hover { transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,0.35); }
    .perf-solv-card { border-radius:11px;padding:10px 12px;cursor:pointer;transition:all 0.15s; }
    .perf-solv-card:hover { transform:translateX(2px); }
    .perf-cas-card { border-radius:11px;padding:10px 12px;cursor:pointer;transition:all 0.15s;margin-bottom:6px; }
    .perf-cas-card:hover { transform:translateX(3px); }

    .perf-etiquette { margin-top:16px;background:rgba(255,255,255,0.03);border:1px dashed;border-radius:12px;padding:13px 15px; }
    .perf-reset { width:100%;margin-top:14px;padding:9px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s; }
    .perf-reset:hover { border-color:var(--border2);color:#cbd5e1; }
    .perf-nav { padding:10px 20px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s; }
    .perf-nav:hover:not(:disabled) { border-color:var(--border2);color:#e2e8f0; }

    .perf-enonce { background:rgba(255,255,255,0.03);border:1px solid var(--border);border-left:3px solid #22d3ee;border-radius:12px;padding:15px 18px;font-size:12.5px;color:#cbd5e1;line-height:1.8; }
    .perf-score { text-align:center;border:1px solid;border-radius:16px;padding:22px 18px;margin-bottom:16px; }
    .perf-detail { background:var(--surface);border:1px solid;border-radius:12px;padding:12px 15px;margin-bottom:8px; }

    @media (max-width:900px) {
      .perf-wrap { flex-direction:column; }
      .perf-side { width:100%!important;border-right:none;border-bottom:1px solid var(--border);max-height:250px; }
      .perf-main { padding:18px 15px 40px; }
    }

    @media (max-width:768px) {
      .sidebar { position:fixed!important;z-index:100!important;transform:translateX(-100%);transition:transform 0.25s;width:234px!important; }
      .sidebar.open { transform:translateX(0); }
      .mobile-menu { display:flex!important; }
      .macros-grid { grid-template-columns:1fr!important; }
      .body-wrap { flex-direction:column; }
      .body-svg-col { border-right:none;border-bottom:1px solid var(--border); }
    }
  </style>
</head>

/* ════════════════════════════════ PDF IMPORT MODAL ══ */
function PdfModal({onClose,onImport}){
  const [loading,setLoading]=useState(false);
  const [sugg,setSugg]=useState([]);
  const [sel,setSel]=useState(new Set());
  const [cat,setCat]=useState('Autres');
  const [err,setErr]=useState('');
  const [over,setOver]=useState(false);
  const parseText=text=>{
    const lines=text.split(/\n|\. /).map(l=>l.trim()).filter(l=>l.length>18&&l.length<220);
    const res=[];const seen=new Set();
    for(const line of lines){if(seen.has(line))continue;seen.add(line);
      if(line.startsWith('/me '))res.push({titre:line.slice(4,55),texte:line,type:'me'});
      else if(/^(poser|placer|vérifier|administrer|préparer|retirer|fixer|surveiller|mesurer|appliquer|injecter|perfuser|intuber|ventiler|comprimer|prendre|effectuer|réaliser|installer|brancher)/i.test(line)){
        const c=line.replace(/^[•\-–—*·►▶\s]+/,'').trim();
        res.push({titre:c.slice(0,55),texte:'/me '+c.charAt(0).toLowerCase()+c.slice(1).replace(/[.!?]$/,'')+'.', type:'me'});
      }
    }
    return res.slice(0,25);
  };
  const process=async file=>{
    if(!file||file.type!=='application/pdf'){setErr('Veuillez sélectionner un fichier PDF.');return;}
    setLoading(true);setErr('');setSugg([]);
    try{
      const lib=window['pdfjs-dist/build/pdf'];
      lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buf=await file.arrayBuffer();const pdf=await lib.getDocument({data:buf}).promise;
      let text='';
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){const page=await pdf.getPage(i);const c=await page.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n';}
      const list=parseText(text);
      if(!list.length)setErr('Aucune procédure détectée automatiquement.');
      else{setSugg(list);setSel(new Set(list.map((_,i)=>i)));}
    }catch(e){setErr('Erreur lecture PDF : '+e.message);}
    finally{setLoading(false);}
  };
  const toggle=i=>setSel(s=>{const n=new Set(s);n.has(i)?n.delete(i):n.add(i);return n;});
  const doImport=()=>{const items=sugg.filter((_,i)=>sel.has(i)).map(s=>({id:uid(),categorie:s.type==='qu'?'Questions /qu':cat,...s}));onImport(items);onClose();};
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" style={{maxWidth:600,maxHeight:'80vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
          <h2 style={{fontSize:'17px',fontWeight:900,color:'#f1f5f9'}}>📄 Importer un PDF</h2>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'4px'}}><Ic.X/></button>
        </div>
        {!sugg.length&&!loading&&(
          <div className={`drop-zone ${over?'over':''}`} onDrop={e=>{e.preventDefault();setOver(false);process(e.dataTransfer.files[0]);}} onDragOver={e=>{e.preventDefault();setOver(true);}} onDragLeave={()=>setOver(false)} onClick={()=>document.getElementById('_pdfin').click()}>
            <div style={{color:'var(--faint)',marginBottom:14}}><Ic.Pdf/></div>
            <div style={{fontSize:15,fontWeight:700,color:'var(--muted)',marginBottom:6}}>Déposez un PDF ici</div>
            <div style={{fontSize:13,color:'#334155'}}>ou cliquez pour parcourir</div>
            <input id="_pdfin" type="file" accept=".pdf" style={{display:'none'}} onChange={e=>process(e.target.files[0])}/>
          </div>
        )}
        {loading&&<div style={{textAlign:'center',padding:32,color:'var(--me)',fontSize:14}}>⏳ Analyse en cours…</div>}
        {err&&<div style={{background:'rgba(244,63,94,0.08)',border:'1px solid rgba(244,63,94,0.25)',color:'#fda4af',padding:'12px 16px',borderRadius:10,fontSize:13}}>{err}</div>}
        {sugg.length>0&&<>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <span style={{fontSize:13,fontWeight:800,color:'var(--muted)'}}>{sugg.length} procédure(s) détectée(s)</span>
            <select value={cat} onChange={e=>setCat(e.target.value)} style={{padding:'4px 8px',borderRadius:7,fontSize:12}}>{CATEGORIES.filter(c=>c!=='Tous'&&c!=='Favoris'&&c!=='Questions /qu').map(c=><option key={c}>{c}</option>)}</select>
          </div>
          <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:7,marginBottom:16}}>
            {sugg.map((s,i)=>(
              <div key={i} onClick={()=>toggle(i)} style={{background:sel.has(i)?'var(--me-dim)':'rgba(255,255,255,0.02)',border:`1px solid ${sel.has(i)?'var(--me-border)':'var(--border)'}`,borderRadius:9,padding:'10px 14px',cursor:'pointer'}}>
                <div style={{fontSize:11.5,fontFamily:'JetBrains Mono',color:sel.has(i)?'var(--text)':'var(--muted)'}}>{sel.has(i)?'✓ ':'○ '}{s.texte}</div>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <ModalBtn ghost onClick={onClose}>Annuler</ModalBtn>
            <ModalBtn onClick={doImport}>Importer {sel.size} macro(s)</ModalBtn>
          </div>
        </>}
      </div>
    </div>
  );
}

/* ══════════════════════════════ GENERATE MODAL ══ */
function GenerateModal({onClose,onAdd}){
  const [desc,setDesc]=useState('');
  const [type,setType]=useState('me');
  const [cat,setCat]=useState('Autres');
  const [results,setResults]=useState([]);
  const [sel,setSel]=useState(new Set());
  const generate=()=>{
    if(!desc.trim())return;
    const l=desc.trim(),lo=l.charAt(0).toLowerCase()+l.slice(1).replace(/[.!?]$/,'');
    const list=type==='me'?[`/me prépare le matériel nécessaire puis procède à ${lo}.`,`/me ${lo} en respectant les règles d\'hygiène et d\'asepsie.`,`/me effectue ${lo} avec soin, puis note l\'heure et les paramètres dans le dossier.`,`/me vérifie les constantes vitales avant de ${lo}.`]:[`/qu ${lo.charAt(0).toUpperCase()+lo.slice(1)} ?`,`/qu Pouvez-vous me préciser ${lo} ?`,`/qu Avez-vous des informations concernant ${lo} ?`];
    setResults(list);setSel(new Set([0]));
  };
  const toggle=i=>setSel(s=>{const n=new Set(s);n.has(i)?n.delete(i):n.add(i);return n;});
  const doAdd=()=>{const macros=results.filter((_,i)=>sel.has(i)).map(texte=>({id:uid(),categorie:type==='qu'?'Questions /qu':cat,type,titre:desc.slice(0,55),texte}));onAdd(macros);onClose();};

              {t==='me'?'🩺 /me Action':'💬 /qu Question'}
            </button>
          ))}
        </div>
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <input type="text" placeholder={type==='me'?'Ex: pose d\'un cathéter 18G':'Ex: voie passe'} value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==='Enter'&&generate()} style={{...INP,flex:1}}/>

        </div>
        {results.length>0&&<>

          <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:18}}>

          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <ModalBtn ghost onClick={onClose}>Annuler</ModalBtn>
            <ModalBtn color={type} onClick={doAdd}>Ajouter {sel.size} macro(s)</ModalBtn>
          </div>
        </>}
      </div>
    </div>
  );
}

function ZoneShape({zoneId,isSelected,isHovered,onSelect,onHover}){
  const zone=ZONES.find(z=>z.id===zoneId);
  const sh=SVG_SHAPES[zoneId];
  if(!zone||!sh)return null;
  const color=getZoneColor(zone);

  // ── Label anatomique (os IO) ──
  if(sh.s==='label'){
    const isRight=sh.lx>100;
    const W=sh.w||68; // largeur label (défaut 68)
    const lineEndX=isRight?sh.lx:sh.lx+W;
    const lineEndY=sh.ly+7;
    const active=isSelected||isHovered;
    return(
      <g style={{cursor:'pointer'}} onClick={()=>onSelect(zoneId)} onMouseEnter={()=>onHover(zoneId)} onMouseLeave={()=>onHover(null)}>
        {/* Trait */}
        <line x1={sh.bx} y1={sh.by} x2={lineEndX} y2={lineEndY} stroke={active?color+'dd':color+'55'} strokeWidth={1}/>
        {/* Point sur l'os */}
        <circle cx={sh.bx} cy={sh.by} r={isSelected?5:isHovered?4:3}
          fill={isSelected?color+'cc':isHovered?color+'88':color+'44'}
          stroke={color} strokeWidth={isSelected?2:1.5}
          style={{transition:'all 0.13s'}}/>
        {/* Boîte label */}
        <rect x={sh.lx} y={sh.ly} width={W} height={15} rx={3}
          fill={isSelected?color+'20':isHovered?color+'10':'rgba(6,13,26,0.92)'}
          stroke={isSelected?color:active?color+'88':color+'44'}
          strokeWidth={isSelected?1.5:1}/>
        {/* Texte */}
        <text x={sh.lx+W/2} y={sh.ly+10.5} textAnchor="middle"
          fill={isSelected?color:isHovered?color:color+'bb'}
          fontSize="7.5" fontWeight="700" fontFamily="Inter,sans-serif" letterSpacing="0.3">
          🦴 {sh.label}
        </text>
      </g>
    );
  }

  const fill=isSelected?color+'55':isHovered?color+'33':color+'18';
  const stroke=isSelected?color:isHovered?color+'cc':color+'44';
  const strokeWidth=isSelected?2.5:isHovered?1.8:1.2;
  const common={fill,stroke,strokeWidth,style:{cursor:'pointer',transition:'all 0.13s ease'},onClick:()=>onSelect(zoneId),onMouseEnter:()=>onHover(zoneId),onMouseLeave:()=>onHover(null)};
  if(sh.s==='circle') return <circle cx={sh.cx} cy={sh.cy} r={sh.r} {...common}/>;
  if(sh.s==='ellipse') return <ellipse cx={sh.cx} cy={sh.cy} rx={sh.rx} ry={sh.ry} {...common}/>;
  if(sh.s==='rect') return <rect x={sh.x} y={sh.y} width={sh.w} height={sh.h} rx={sh.rx||0} {...common}/>;
  if(sh.s==='path') return <path d={sh.d} {...common}/>;
  return null;
}

function ProceduresView({ showToast }) {
  const [selProc, setSelProc] = useState(null);

  const [doneSteps, setDoneSteps] = useState(new Set());

  const proc = selProc ? PROCEDURES.find(p => p.id === selProc) : null;

  const selectProc = id => { setSelProc(id); setCurrentStep(0); setDoneSteps(new Set()); };
  const reset = () => { setCurrentStep(0); setDoneSteps(new Set()); };

  const copyText = async text => {
    try { await navigator.clipboard.writeText(text); }
    catch { const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove(); }
  };

  const copyAndAdvance = async () => {
    if (!proc) return;
    await copyText(proc.etapes[currentStep].texte);
    const nd = new Set(doneSteps); nd.add(currentStep); setDoneSteps(nd);
    showToast(`/me copié — étape ${currentStep+1} ✓`, 'me');
    if (currentStep < proc.etapes.length - 1) setCurrentStep(currentStep + 1);
  };

  const copyStep = async idx => {
    if (!proc) return;
    await copyText(proc.etapes[idx].texte);
    const nd = new Set(doneSteps); nd.add(idx); setDoneSteps(nd);
    showToast('/me copié !', 'me');

  return (

  );

/* ════════════════════════════════════ PERFUSION — ATELIER & EXAMEN ══ */

const nf = (n,d=2) => {
  if(!isFinite(n)||isNaN(n)) return '—';
  const r = Math.round(n*Math.pow(10,d))/Math.pow(10,d);
  return String(r).replace('.',',');
};
const heureNow = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0'); };
const getSolv = id => PERF_SOLVANTS.find(s=>s.id===id);
const getDrug = id => PERF_DRUGS.find(d=>d.id===id);
const defaultSolv = d => {
  if(d.solvOk.length===1 && d.solvOk[0]==='pur') return 'pur';
  const a = PERF_SOLVANTS.find(x=>x.base===d.solvIdeal && x.vol===d.volStd);
  if(a) return a.id;
  const b = PERF_SOLVANTS.find(x=>x.base===d.solvIdeal);
  return b ? b.id : null;
};
const isFluide = d => !!d && d.unit==='mL';
const pretEmploi = d => !!d && d.solvOk.length===1 && d.solvOk[0]==='pur';
const volFinal = (drug,solv,volSel) => {
  if(!solv) return 0;
  if(drug.volOptions && volSel && drug.volOptions.includes(volSel)) return volSel;
  return solv.base==='pur' ? (drug.volPur||drug.volStd) : solv.vol;
};

/* Calcul du débit */
function perfCalc(drug, qte, vol, dose, poids){
  const conc = vol>0 ? qte/vol : 0;
  let mlh = 0;
  if(conc>0){
    switch(drug.mode){
      case 'gkm': mlh = (dose*poids*60)/(conc*1000); break;
      case 'gkh': mlh = (dose*poids)/conc;           break;
      case 'mkh': mlh = (dose*poids)/conc;           break;
      case 'mgh': mlh = dose/conc;                   break;
      case 'uih': mlh = dose/conc;                   break;
      case 'duree': mlh = dose>0 ? vol/(dose/60) : 0; break;
      default: mlh = 0;
    }
  }
  return { conc, mlh, gttes: mlh/3, auto: mlh>0 ? vol/mlh : 0 };
}

/* Compatibilité solvant */
function checkSolvant(drug, solv){
  if(!drug||!solv) return null;
  if(solv.base==='pur' && !drug.purOk)
    return `${drug.nom} ne s’administre jamais pur : il faut le diluer avant perfusion.`;
  if(solv.base!=='pur' && !drug.solvOk.includes(solv.base)){
    if(drug.solvNo && drug.solvNo[solv.base]) return drug.solvNo[solv.base];
    return `${drug.nom} ne se dilue pas dans du ${BASE_NOM[solv.base]} — solvant(s) validé(s) : ${drug.solvOk.map(b=>BASE_NOM[b]).join(', ')}.`;
  }
  if(solv.base==='pur' && drug.purOk && drug.solvOk.includes('pur')) return null;
  return null;
}

/* Alertes de sécurité sur la prescription montée */
function checkPresc(drug, qte, vol, dose, poids, r){
  const out = [];
  if(drug.mode!=='duree'){
    if(dose < drug.dmin) out.push({lvl:'warn', txt:`Dose sous la fourchette habituelle (${nf(drug.dmin,3)}–${nf(drug.dmax,3)} ${drug.dunit}) — effet probablement insuffisant.`});
    if(dose > drug.dmax) out.push({lvl:'err',  txt:`SURDOSAGE : au-dessus de la dose maximale de ${nf(drug.dmax,3)} ${drug.dunit}.`});
  } else {
    if(dose < drug.dmin) out.push({lvl:'err',  txt:`Passage trop rapide : le protocole impose au minimum ${drug.dmin} minutes.`});
    if(dose > drug.dmax) out.push({lvl:'warn', txt:`Passage très lent (> ${drug.dmax} min) — retard thérapeutique.`});
  }
  if(drug.id==='p_kcl'){
    const gh = (qte/vol)*r.mlh;
    if(gh > 1.02) out.push({lvl:'err', txt:`${nf(gh,2)} g de KCl par heure — le maximum en voie périphérique est de 1 g/h. Ralentir ou diluer davantage.`});
  }
  if(isFluide(drug) && poids>0){
    const mlkg = vol/poids;
    if(mlkg > 22) out.push({lvl:'warn', txt:`${nf(mlkg,1)} mL/kg d’un coup : c’est beaucoup pour un seul passage. Réévaluer la tolérance (auscultation, SpO2) avant de poursuivre.`});
    if(drug.id==='p_ssh' && mlkg > 5) out.push({lvl:'err', txt:`${nf(mlkg,1)} mL/kg de sérum salé hypertonique — la dose de référence est de 4 mL/kg, soit environ ${nf(poids*4,0)} mL pour ce patient.`});
    if(drug.id==='p_plasmion' && mlkg > 33) out.push({lvl:'err', txt:`Au-delà de 33 mL/kg par 24 h de gélatine, le risque hémorragique et rénal l’emporte.`});
  }
  const isSe = vol <= 50;
  if(isSe && r.mlh > 999) out.push({lvl:'err', txt:`Débit de ${nf(r.mlh,0)} mL/h : impossible à régler sur un pousse-seringue (max 999 mL/h). Revoir la dilution.`});
  if(!isSe && r.mlh > 900) out.push({lvl:'warn', txt:`${nf(r.mlh,0)} mL/h : au-delà de ce qu’une perfusion par gravité peut délivrer — il faut une poche à pression ou un accélérateur de perfusion.`});
  if(r.mlh > 0 && r.mlh < 0.5) out.push({lvl:'warn', txt:`Débit très faible (${nf(r.mlh,2)} mL/h) : préparation trop concentrée, la titration sera imprécise.`});
  if(isSe && drug.mode!=='duree' && r.mlh > 60) out.push({lvl:'warn', txt:`À ${nf(r.mlh,1)} mL/h, la seringue de ${vol} mL est vide en ${nf(r.auto,1)} h — préparer le relais à l’avance.`});
  return out;
}

/* Génération des /me */
function perfMe(drug, solv, qte, vol, dose, poids, r){
  const u = drug.unit;
  const fluide = isFluide(drug);
  const useSe = !!solv.se && vol<=50 && !fluide;
  const ligne  = drug.sang ? 'un transfuseur muni d’un filtre' : (useSe ? 'un prolongateur' : 'une tubulure de perfusion');
  const appareil = drug.sang ? 'du transfuseur' : 'du perfuseur';
  const nomCourt = drug.nom.split('—')[0].trim();
  const dilTxt = solv.base==='pur' ? `sans dilution, tel quel` : `dans ${nf(vol,0)} mL de ${BASE_NOM[solv.base]}`;
  const contenant = useSe ? (vol<=20?'une seringue de 20 mL':'une seringue de 50 mL') : `une poche de ${nf(vol,0)} mL`;
  const conc = `${nf(r.conc,3)} ${u}/mL`;

  return {
    verif: fluide
      ? `/me contrôle la poche de ${nomCourt} avant de la suspendre : nom du soluté, volume de ${nf(vol,0)} mL, date de péremption, limpidité de la solution et intégrité de l’emballage, puis se désinfecte les mains.`
      : `/me vérifie l’étiquette de l’ampoule de ${drug.nom} — nom du produit, dosage ${drug.amp} et date de péremption — contrôle l’intégrité du conditionnement, se désinfecte les mains et prépare un plan de travail propre.`,
    prep: fluide
      ? `/me suspend la poche de ${nf(vol,0)} mL de ${nomCourt} à la potence, y adapte ${ligne} et ferme le clamp avant de purger la ligne.`
      : solv.base==='pur'
        ? `/me prépare ${drug.nom} ${dilTxt} : ${nf(qte,2)} ${u} pour ${nf(vol,0)} mL, soit une concentration de ${conc}, et purge l’air de la seringue.`
        : `/me prélève ${nf(qte,2)} ${u} de ${drug.nom} (${drug.amp}) à l’aide d’une seringue stérile puis l’injecte ${dilTxt} pour obtenir ${contenant} de ${nf(vol,0)} mL à ${conc}, avant d’homogénéiser doucement la préparation.`,
    etiq: fluide
      ? `/me inscrit sur la poche l’heure de pose, le volume de ${nf(vol,0)} mL et le nom du patient, puis reporte l’apport sur la feuille de bilan des entrées et des sorties.`
      : `/me colle une étiquette sur ${useSe?'la seringue':'la poche'} et y inscrit lisiblement : « ${drug.nom} — ${nf(qte,2)} ${u} / ${nf(vol,0)} mL — ${conc} — ${heureNow()} », puis ajoute ses initiales et le nom du patient.`,
    purge: `/me connecte ${ligne} à ${fluide?'la poche':'la préparation'}, ouvre le clamp et purge intégralement la ligne jusqu’à chasser la dernière bulle d’air, puis referme le clamp.`,
    branch: `/me désinfecte le robinet de la voie veineuse à l’antiseptique, contrôle la perméabilité du cathéter par un flush de sérum physiologique, puis y connecte la ligne purgée de ${nomCourt} en vérifiant l’absence de douleur et d’extravasation.`,
    debit: useSe
      ? `/me installe la seringue de ${drug.nom} dans le pousse-seringue électrique, sélectionne le volume et règle le débit à ${nf(r.mlh,1)} mL/h — soit ${nf(dose,3)} ${drug.dunit}${drug.mode.includes('k')?` pour ${poids} kg`:''} — puis lance la perfusion et s’assure de l’absence d’alarme d’occlusion.`
      : `/me règle la molette ${appareil} sur ${nf(r.gttes,0)} gouttes par minute, soit ${nf(r.mlh,0)} mL/h, pour faire passer les ${nf(vol,0)} mL en ${drug.mode==='duree'?nf(dose,0)+' minutes':'la durée prescrite'}, et contrôle l’écoulement régulier dans la chambre compte-gouttes.`,
    surv: `/me note sur la feuille de surveillance l’heure de début, le produit, ${fluide?'le volume':'la dilution'} et le débit réglé, puis met en place la surveillance : ${drug.objectif}. ${drug.mode==='duree'?'Il repasse contrôler le point de ponction avant la fin du passage.':'Il réévalue le débit toutes les 5 minutes selon la réponse du patient.'}`,
  };
}
