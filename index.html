  const searchRef=useRef(null);
  const timerRef=useRef(null);

  const all=useMemo(()=>[...DEFAULT_MACROS,...custom],[custom]);
  const filtered=useMemo(()=>{
    let list=all;
    if(cat==='Favoris')list=list.filter(m=>favs.includes(m.id));
    else if(cat!=='Tous')list=list.filter(m=>m.categorie===cat);
    if(q){const lq=q.toLowerCase();list=list.filter(m=>m.titre.toLowerCase().includes(lq)||m.texte.toLowerCase().includes(lq)||m.categorie.toLowerCase().includes(lq));}
    return [...list].sort((a,b)=>(favs.includes(b.id)?1:0)-(favs.includes(a.id)?1:0));
  },[all,cat,q,favs]);

  const counts=useMemo(()=>{
    const c={};
    CATEGORIES.forEach(k=>{if(k==='Tous')c[k]=all.length;else if(k==='Favoris')c[k]=favs.length;else c[k]=all.filter(m=>m.categorie===k).length;});
    return c;
  },[all,favs]);

  useEffect(()=>{save('mRP2_custom',custom);},[custom]);
  useEffect(()=>{save('mRP2_favs',favs);},[favs]);
  useEffect(()=>{save('mRP2_sessionActive',sessionActive);},[sessionActive]);
  useEffect(()=>{save('mRP2_sessionLog',sessionLog);},[sessionLog]);

  useEffect(()=>{
    const h=e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(view==='body')setView('macros');searchRef.current?.focus();searchRef.current?.select();}
      if((e.ctrlKey||e.metaKey)&&e.key==='1'){e.preventDefault();setCat('Cathéters');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='2'){e.preventDefault();setCat('Monitoring');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='3'){e.preventDefault();setCat('Réanimation');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='4'){e.preventDefault();setCat('Questions /qu');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();setView(v=>v==='body'?'macros':'body');}
      if((e.ctrlKey||e.metaKey)&&e.key==='p'){e.preventDefault();setView(v=>v==='procedures'?'macros':'procedures');}
      if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();setView(v=>v==='perfusion'?'macros':'perfusion');}
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();setSessionActive(true);setView(v=>v==='session'?'macros':'session');}
      if(e.key==='Escape'){setModal(null);setSidebar(false);}
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[view,sessionActive]);

  const showToast=useCallback((msg,type='me')=>{
    if(timerRef.current)clearTimeout(timerRef.current);
    setToast({msg,show:true,type});
    timerRef.current=setTimeout(()=>setToast(t=>({...t,show:false})),2700);
  },[]);

  const handleCopy=useCallback(async macro=>{
    const t=isME(macro)?'me':'qu';
    try{await navigator.clipboard.writeText(macro.texte);}
    catch{const el=document.createElement('textarea');el.value=macro.texte;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();}
    showToast(`/${t} copié dans le presse-papiers !`,t);
    if(sessionActive){
      setSessionLog(log=>[...log,{id:uid(),type:t,titre:macro.titre,texte:macro.texte,categorie:macro.categorie,heure:nowHM()}]);
    }
  },[showToast,sessionActive]);

  const handleFav=useCallback(id=>setFavs(f=>f.includes(id)?f.filter(x=>x!==id):[...f,id]),[]);
  const handleDel=useCallback(id=>{setCustom(c=>c.filter(m=>m.id!==id));setFavs(f=>f.filter(x=>x!==id));},[]);
  const handleSave=useCallback(m=>{setCustom(c=>[...c,m]);showToast('Macro créée !',m.type||'me');},[showToast]);
  const handleAdd=useCallback(ms=>{setCustom(c=>[...c,...ms]);showToast(`${ms.length} macro(s) ajoutée(s) !`,ms[0]?.type||'me');},[showToast]);

  const openSession=useCallback(()=>{setSessionActive(true);setView(v=>v==='session'?'macros':'session');},[]);
  const toggleSessionActive=useCallback(()=>setSessionActive(a=>!a),[]);
  const updateSessionTime=useCallback((id,heure)=>setSessionLog(log=>log.map(e=>e.id===id?{...e,heure}:e)),[]);
  const deleteSessionEntry=useCallback(id=>setSessionLog(log=>log.filter(e=>e.id!==id)),[]);
  const clearSessionLog=useCallback(()=>setSessionLog([]),[]);

  const isBodyView=view==='body';
  const isProcView=view==='procedures';
  const isPerfView=view==='perfusion';
  const isSessionView=view==='session';
  const isBilanView=view==='bilan';
  const isFichesView=view==='fiches';
  const isDuoView=view==='duo';

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {sidebar&&<div onClick={()=>setSidebar(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:50,backdropFilter:'blur(4px)'}}/>}

      {/* ════ SIDEBAR ════ */}
      <aside className={`sidebar ${sidebar?'open':''}`} style={{width:234,flexShrink:0,display:'flex',flexDirection:'column',height:'100vh',overflowY:'auto'}}>
        {/* Logo */}
        <div style={{borderBottom:'1px solid var(--border)'}}>
          {/* ── vLifeRoleplay logo ── */}
          <div className="vlife-logo-bar">
            {/* subtle cyan glow behind logo */}
            <div style={{position:'absolute',top:-20,left:-20,width:80,height:80,borderRadius:'50%',background:'rgba(34,211,238,0.06)',pointerEvents:'none'}}/>
            <svg viewBox="0 0 202 68" width="202" height="68" style={{display:'block',overflow:'visible'}}>
              {/* ── i mark (dot + stem stylisé) ── */}
              <rect x="0" y="0" width="10" height="3" rx="1" fill="white"/>
              <rect x="0" y="6" width="10" height="28" rx="1" fill="white"/>
              {/* ── V ── */}
              <polygon points="16,0 28,0 36,26 44,0 56,0 42,34 30,34" fill="white"/>
              {/* ── L ── */}
              <rect x="60" y="0" width="11" height="34" rx="1" fill="white"/>
              <rect x="60" y="25" width="22" height="9" rx="1" fill="white"/>
              {/* ── I ── */}
              <rect x="86" y="0" width="11" height="34" rx="1" fill="white"/>
              {/* ── F ── */}
              <rect x="101" y="0" width="11" height="34" rx="1" fill="white"/>
              <rect x="101" y="0" width="22" height="9" rx="1" fill="white"/>
              <rect x="101" y="13" width="18" height="8" rx="1" fill="white"/>
              {/* ── E ── */}
              <rect x="127" y="0" width="11" height="34" rx="1" fill="white"/>
              <rect x="127" y="0" width="22" height="9" rx="1" fill="white"/>
              <rect x="127" y="13" width="18" height="8" rx="1" fill="white"/>
              <rect x="127" y="25" width="22" height="9" rx="1" fill="white"/>
              {/* ── ROLEPLAY ── */}
              <text x="0" y="62" fontFamily="Inter,sans-serif" fontWeight="900" fontSize="19" fill="white" letterSpacing="2.5">ROLEPLAY</text>
            </svg>
          </div>
          {/* ── MedRP / SAMU 93 sub-brand ── */}
          <div style={{padding:'11px 16px 13px',display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,borderRadius:10,background:'linear-gradient(135deg,#0891b2,#4f46e5)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0,boxShadow:'0 0 16px rgba(8,145,178,0.35)'}}>⚕️</div>
            <div>
              <div style={{fontSize:14,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em',lineHeight:1.2}}>MedRP</div>
              <div style={{fontSize:9.5,color:'var(--muted)',fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',marginTop:1}}>SAMU 93 · SMUR</div>
            </div>
          </div>
        </div>

        {/* Stats */}
        <div style={{display:'flex',padding:'9px 12px',gap:6,borderBottom:'1px solid var(--border)'}}>
          {[['me',all.filter(m=>isME(m)).length,'#22d3ee','rgba(34,211,238,0.08)'],['qu',all.filter(m=>!isME(m)).length,'#a78bfa','rgba(167,139,250,0.08)']].map(([t,n,c,bg])=>(
            <div key={t} style={{flex:1,background:bg,border:`1px solid ${c}22`,borderRadius:9,padding:'7px 10px',textAlign:'center'}}>
              <div style={{fontSize:17,fontWeight:900,color:c,lineHeight:1}}>{n}</div>
              <div style={{fontSize:8.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.1em',color:c,opacity:0.6,fontFamily:'JetBrains Mono',marginTop:2}}>/{t}</div>
            </div>
          ))}
          <div style={{flex:1,background:'rgba(251,191,36,0.06)',border:'1px solid rgba(251,191,36,0.15)',borderRadius:9,padding:'7px 10px',textAlign:'center'}}>
            <div style={{fontSize:17,fontWeight:900,color:'#fbbf24',lineHeight:1}}>{all.length}</div>
            <div style={{fontSize:8.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.1em',color:'#fbbf24',opacity:0.6,fontFamily:'JetBrains Mono',marginTop:2}}>total</div>
          </div>
        </div>

        {/* Nav */}
        <div style={{padding:'14px 10px 6px',flex:1}}>
          {/* Body schema button */}
          <button onClick={()=>{setView(v=>v==='body'?'macros':'body');setSidebar(false);}}
            className={`cat-btn ${isBodyView?'active-body':''}`}>
            <span><span style={{marginRight:8}}>🫀</span>Schéma corporel</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+B</span>
          </button>

          {/* Procedures button */}
          <button onClick={()=>{setView(v=>v==='procedures'?'macros':'procedures');setSidebar(false);}}
            className={`cat-btn ${isProcView?'active-body':''}`}
            style={isProcView?{background:'rgba(139,92,246,0.08)',color:'#a78bfa'}:{}}>
            <span><span style={{marginRight:8}}>🗂️</span>Procédures guidées</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+P</span>
          </button>

          {/* Perfusion button */}
          <button onClick={()=>{setView(v=>v==='perfusion'?'macros':'perfusion');setSidebar(false);}}
            className={`cat-btn ${isPerfView?'active':''}`}
            style={isPerfView?{background:'rgba(56,189,248,0.09)',color:'#38bdf8'}:{}}>
            <span><span style={{marginRight:8}}>🧪</span>Faire ma perfusion</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+I</span>
          </button>

          {/* Bilan button */}
          <button onClick={()=>{setView(v=>v==='bilan'?'macros':'bilan');setSidebar(false);}}
            className={`cat-btn ${isBilanView?'active':''}`}
            style={isBilanView?{background:'rgba(34,211,238,0.09)',color:'#22d3ee'}:{}}>
            <span><span style={{marginRight:8}}>📻</span>Bilan régulation</span>
          </button>

          {/* Duo button */}
          <button onClick={()=>{setView(v=>v==='duo'?'macros':'duo');setSidebar(false);}}
            className={`cat-btn ${isDuoView?'active':''}`}
            style={isDuoView?{background:'rgba(251,146,60,0.09)',color:'#fb923c'}:{}}>
            <span><span style={{marginRight:8}}>🚒</span>PISU + Bilan (BSPP)</span>
          </button>

          {/* Fiches button */}
          <button onClick={()=>{setView(v=>v==='fiches'?'macros':'fiches');setSidebar(false);}}
            className={`cat-btn ${isFichesView?'active':''}`}
            style={isFichesView?{background:'rgba(34,211,238,0.09)',color:'#22d3ee'}:{}}>
            <span><span style={{marginRight:8}}>📚</span>Fiches protocoles & pharmaco</span>
          </button>

          {/* Session button */}
          <button onClick={()=>{openSession();setSidebar(false);}}
            className={`cat-btn ${isSessionView?'active':''}`}
            style={isSessionView?{background:'rgba(52,211,153,0.09)',color:'var(--green)'}:{}}>
            <span><span style={{marginRight:8}}>🕒</span>Mode session{sessionLog.length>0?` (${sessionLog.length})`:''}</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+S</span>
          </button>

          <div style={{height:1,background:'var(--border)',margin:'10px 4px'}}/>

          <div className="section-label">/me — Actions</div>
          {CATEGORIES.filter(c=>c!=='Todos'&&c!=='Favoris'&&c!=='Questions /qu'&&c!=='Autres').map(c=>(
            <button key={c} onClick={()=>{setCat(c);setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat===c?'active':''}`}>
              <span><span style={{marginRight:8}}>{CAT_ICON[c]}</span>{c}</span>
              <span className="badge">{counts[c]||0}</span>
            </button>
          ))}

          <div style={{height:1,background:'var(--border)',margin:'10px 4px'}}/>
          <div style={{fontSize:9,fontWeight:800,color:'var(--qu)',textTransform:'uppercase',letterSpacing:'0.1em',padding:'4px 12px 4px',opacity:0.8}}>/qu — Questions</div>
          <button onClick={()=>{setCat('Questions /qu');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Questions /qu'?'active-qu':''}`}>
            <span><span style={{marginRight:8}}>💬</span>Questions /qu</span>
            <span className="badge">{counts['Questions /qu']||0}</span>
          </button>
          <button onClick={()=>{setCat('Autres');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Autres'?'active':''}`}>
            <span><span style={{marginRight:8}}>📋</span>Autres</span>
            <span className="badge">{counts['Autres']||0}</span>
          </button>

          <div style={{height:1,background:'var(--border)',margin:'10px 4px'}}/>
          <button onClick={()=>{setCat('Tous');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Tous'?'active':''}`}>
            <span><span style={{marginRight:8}}>🏥</span>Toutes les macros</span>
            <span className="badge">{counts['Tous']||0}</span>
          </button>
          <button onClick={()=>{setCat('Favoris');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Favoris'?'active':''}`}>
            <span><span style={{marginRight:8}}>⭐</span>Favoris</span>
            <span className="badge" style={{color:'var(--gold)'}}>{counts['Favoris']||0}</span>
          </button>
        </div>

        {/* Actions */}
        <div style={{padding:'12px 10px',borderTop:'1px solid var(--border)'}}>
          <div className="section-label">Actions</div>
          <button className="action-btn" onClick={()=>setModal('create')} style={{color:'var(--me)'}}><Ic.Plus/> Créer une macro</button>
          <button className="action-btn" onClick={()=>setModal('pdf')} style={{color:'var(--qu)'}}><Ic.Upload/> Importer un PDF</button>
          <button className="action-btn" onClick={()=>setModal('gen')} style={{color:'var(--green)'}}><Ic.Spark/> Générer des macros</button>
        </div>

        {/* Shortcuts */}
        <div style={{padding:'12px 14px 18px',borderTop:'1px solid var(--border)'}}>
          <div className="section-label">Raccourcis</div>
          {[['Ctrl+K','Recherche'],['Ctrl+B','Schéma corp.'],['Ctrl+P','Procédures'],['Ctrl+1','Cathéters'],['Ctrl+2','Monitoring'],['Ctrl+3','Réanimation'],['Ctrl+4','Questions /qu'],['Échap','Fermer']].map(([k,l])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,color:'#334155',marginBottom:5}}>
              <span>{l}</span><span className="key-tag">{k}</span>
            </div>
          ))}
        </div>
      </aside>

      {/* ════ MAIN ════ */}
      <main style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',minWidth:0,background:'var(--bg)'}}>

        {/* Top bar */}
        <div className="topbar">
          <button onClick={()=>setSidebar(s=>!s)} style={{background:'var(--surface)',border:'1px solid var(--border)',color:'var(--muted)',padding:'8px',borderRadius:9,cursor:'pointer',alignItems:'center',display:'none'}} className="mobile-menu"><Ic.Menu/></button>

          {/* Body view toggle chip */}
          <button onClick={()=>setView(v=>v==='body'?'macros':'body')} style={{background:isBodyView?'rgba(251,191,36,0.12)':'var(--surface)',border:`1px solid ${isBodyView?'rgba(251,191,36,0.3)':'var(--border)'}`,color:isBodyView?'var(--gold)':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🫀 {isBodyView?'Fermer schéma':'Schéma corporel'}
          </button>

          {/* Procedures toggle chip */}
          <button onClick={()=>setView(v=>v==='procedures'?'macros':'procedures')} style={{background:isProcView?'rgba(139,92,246,0.12)':'var(--surface)',border:`1px solid ${isProcView?'rgba(139,92,246,0.3)':'var(--border)'}`,color:isProcView?'#a78bfa':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🗂️ {isProcView?'Fermer procédures':'Procédures guidées'}
          </button>

          {/* Perfusion toggle chip */}
          <button onClick={()=>setView(v=>v==='perfusion'?'macros':'perfusion')} style={{background:isPerfView?'rgba(56,189,248,0.12)':'var(--surface)',border:`1px solid ${isPerfView?'rgba(56,189,248,0.3)':'var(--border)'}`,color:isPerfView?'#38bdf8':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🧪 {isPerfView?'Fermer perfusion':'Faire ma perfusion'}
          </button>

          {/* Bilan toggle chip */}
          <button onClick={()=>setView(v=>v==='bilan'?'macros':'bilan')} style={{background:isBilanView?'rgba(34,211,238,0.12)':'var(--surface)',border:`1px solid ${isBilanView?'rgba(34,211,238,0.3)':'var(--border)'}`,color:isBilanView?'#22d3ee':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            📻 {isBilanView?'Fermer bilan':'Bilan régulation'}
          </button>

          <button onClick={()=>setView(v=>v==='fiches'?'macros':'fiches')} style={{background:isFichesView?'rgba(34,211,238,0.12)':'var(--surface)',border:`1px solid ${isFichesView?'rgba(34,211,238,0.3)':'var(--border)'}`,color:isFichesView?'#22d3ee':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            📚 {isFichesView?'Fermer fiches':'Fiches'}
          </button>
          <button onClick={()=>setView(v=>v==='duo'?'macros':'duo')} style={{background:isDuoView?'rgba(251,146,60,0.12)':'var(--surface)',border:`1px solid ${isDuoView?'rgba(251,146,60,0.35)':'var(--border)'}`,color:isDuoView?'#fb923c':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🚒 {isDuoView?'Fermer double page':'PISU + Bilan'}
          </button>
          {/* Session toggle chip */}
          <button onClick={openSession} style={{background:isSessionView?'rgba(52,211,153,0.12)':'var(--surface)',border:`1px solid ${isSessionView?'rgba(52,211,153,0.3)':'var(--border)'}`,color:isSessionView?'var(--green)':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🕒 {isSessionView?'Fermer session':sessionActive?`Session (${sessionLog.length})`:'Mode session'}
          </button>

          {!isBodyView&&!isProcView&&!isPerfView&&!isSessionView&&!isBilanView&&!isFichesView&&!isDuoView&&<>
            <div style={{position:'relative',flex:1,maxWidth:500}}>
              <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',color:'var(--muted)',pointerEvents:'none'}}><Ic.Search/></span>
              <input ref={searchRef} type="text" placeholder="Rechercher /me ou /qu… (Ctrl+K)" value={q} onChange={e=>setQ(e.target.value)} style={{...INP,paddingLeft:38,paddingRight:36,borderRadius:12,width:'100%'}}/>
              {q&&<button onClick={()=>setQ('')} style={{position:'absolute',right:11,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'var(--muted)',cursor:'pointer',padding:'3px',borderRadius:5}}><Ic.X s={14}/></button>}
            </div>
            <button className="create-btn" onClick={()=>setModal('create')}><Ic.Plus/> Créer</button>
          </>}
        </div>

        {/* Content */}
        {isBodyView ? (
          <BodySchema showToast={showToast}/>
        ) : isProcView ? (
          <ProceduresView showToast={showToast}/>
        ) : isPerfView ? (
          <PerfusionView showToast={showToast}/>
        ) : isBilanView ? (
          <BilanView showToast={showToast}/>
        ) : isDuoView ? (
          <div style={{display:'flex',flexDirection:window.innerWidth<900?'column':'row',flex:1,minHeight:0,overflow:'hidden'}}>
            <div style={{flex:1,minWidth:0,minHeight:0,display:'flex',flexDirection:'column',overflow:'hidden',borderRight:'1px solid var(--border)'}}>
              <div style={{padding:'8px 16px',fontSize:11,fontWeight:800,letterSpacing:'0.08em',color:'#fb923c',background:'rgba(251,146,60,0.08)'}}>🚒 MODE BSPP · PISU guidé</div>
              <BSPPView showToast={showToast}/>
            </div>
            <div style={{flex:1,minWidth:0,minHeight:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              <div style={{padding:'8px 16px',fontSize:11,fontWeight:800,letterSpacing:'0.08em',color:'#22d3ee',background:'rgba(34,211,238,0.08)'}}>📻 BILAN RÉGULATION</div>
              <BilanView showToast={showToast}/>
            </div>
          </div>
        ) : isFichesView ? (
          <FichesView showToast={showToast}/>
        ) : isSessionView ? (
          <SessionView log={sessionLog} onUpdateTime={updateSessionTime} onDelete={deleteSessionEntry}
            active={sessionActive} onToggleActive={toggleSessionActive} onClear={clearSessionLog}
            showToast={showToast} onClose={()=>setView('macros')}/>
        ) : (
          <>
            <div style={{padding:'16px 20px 12px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:4,height:26,borderRadius:99,background:cat==='Questions /qu'?'var(--qu)':'var(--me)',boxShadow:`0 0 12px ${cat==='Questions /qu'?'var(--qu)':'var(--me)'}`}}/>
                <div>
                  <h1 style={{fontSize:19,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em'}}>{CAT_ICON[cat]} {cat}</h1>
                  <p style={{fontSize:12,color:'var(--muted)',marginTop:2,fontFamily:'JetBrains Mono'}}>{filtered.length} macro{filtered.length!==1?'s':''}{q?` · « ${q} »`:''}</p>
                </div>
              </div>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'16px 20px 24px'}}>
              {filtered.length===0?(
                <div style={{textAlign:'center',padding:'80px 20px',color:'var(--muted)'}}>
                  <div style={{fontSize:52,marginBottom:16}}>{q?'🔍':'✏️'}</div>
                  <div style={{fontSize:16,fontWeight:800,color:'#475569',marginBottom:8}}>{q?'Aucune macro trouvée':'Aucune macro ici'}</div>
                  <div style={{fontSize:13,color:'#334155'}}>{q?`Aucun résultat pour « ${q} »`:'Créez votre première macro avec le bouton + Créer'}</div>
                </div>
              ):(
                <div className="macros-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(288px,1fr))',gap:10}}>
                  {filtered.map(m=><MacroCard key={m.id} macro={m} isFav={favs.includes(m.id)} onCopy={handleCopy} onFav={handleFav} onDelete={handleDel}/>)}
                </div>
              )}
            </div>
          </>
        )}
      </main>

      {modal==='create'&&<CreateModal onClose={()=>setModal(null)} onSave={handleSave}/>}
      {modal==='pdf'&&<PdfModal onClose={()=>setModal(null)} onImport={handleAdd}/>}
      {modal==='gen'&&<GenerateModal onClose={()=>setModal(null)} onAdd={handleAdd}/>}
      <Toast msg={toast.msg} show={toast.show} type={toast.type}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<style>
  @media(max-width:768px){
    .sidebar{display:flex;}
    .mobile-menu{display:flex!important;}
  }
</style>
</body>
</html>
