/* ──────────────────────────────── ATELIER ──────────────────────────────── */
function PerfAtelier({showToast,copy}){
  const [step,setStep]  = useState(0);
  const [poids,setPoids]= useState(75);
  const [drugId,setDrug]= useState(null);
  const [solvId,setSolv]= useState(null);
  const [qte,setQte]    = useState(0);
  const [dose,setDose]  = useState(0);
  const [volSel,setVolSel] = useState(0);

  const drug = getDrug(drugId);
  const solv = getSolv(solvId);
  const fluide = isFluide(drug);
  const vol  = drug&&solv ? volFinal(drug,solv,volSel) : 0;
  const qteE = fluide ? vol : qte;
  const r    = drug&&vol>0 ? perfCalc(drug,qteE,vol,dose,poids) : {conc:0,mlh:0,gttes:0,auto:0};
  const solvErr = checkSolvant(drug,solv);
  const alerts  = drug&&solv&&!solvErr&&vol>0 ? checkPresc(drug,qteE,vol,dose,poids,r) : [];
  const me      = drug&&solv&&vol>0 ? perfMe(drug,solv,qteE,vol,dose,poids,r) : null;
  const blocked = !!solvErr || alerts.some(a=>a.lvl==='err');

  const pickDrug = id => {
    const d = getDrug(id);
    setDrug(id); setQte(d.qteStd); setDose(d.dusuel); setVolSel(d.volStd);
    setSolv(defaultSolv(d));
    setStep(2);
  };

  const reset = ()=>{ setStep(0);setDrug(null);setSolv(null);setQte(0);setDose(0);setVolSel(0); };
  const canNext = [true, !!drug, !!drug&&!!solv&&!solvErr&&qte>0, true, true, true][step];

  const copyAll = () => {
    if(!me) return;
    const lignes=[me.verif];
    if(drug.meExtra) lignes.push(drug.meExtra.texte);
    lignes.push(me.prep,me.etiq,me.purge,me.branch,me.debit,me.surv);
    copy(lignes.join('\n\n'));
    showToast(`Protocole complet copié (${lignes.length} /me) !`,'me');
  };

  return (
    <div className="perf-wrap">
      {/* ── Colonne étapes ── */}
      <div className="perf-side">
        <div style={{fontSize:9.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--muted)',marginBottom:11,paddingLeft:3}}>Montage de la perfusion</div>
        {PERF_STEPS.map((s,i)=>{
          const st = i<step?'done':i===step?'current':'pending';
          return (
            <div key={s.k} onClick={()=>{ if(i<=step||drug) setStep(i); }} className={`step-item ${st}`} style={{marginBottom:6}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div className={`step-num ${st}`}>{i<step?'✓':i+1}</div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:800,color:st==='done'?'#34d399':st==='current'?'var(--me)':'#64748b',lineHeight:1.3}}>{s.ic} {s.t}</div>
                  <div style={{fontSize:10,color:'#475569',marginTop:2}}>{s.d}</div>
                </div>
              </div>
            </div>
          );
        })}

        {/* Étiquette live */}
        {drug&&solv&&vol>0&&!solvErr&&(
          <div className="perf-etiquette" style={{borderColor:drug.color+'55'}}>
            <div style={{fontSize:8.5,fontWeight:800,letterSpacing:'0.14em',textTransform:'uppercase',color:drug.color,marginBottom:6}}>◉ Étiquette {(solv.se&&vol<=50&&!fluide)?'seringue':'poche'}</div>
            <div style={{fontSize:13,fontWeight:900,color:'#f1f5f9',lineHeight:1.25,marginBottom:5}}>{drug.nom}</div>
            <div style={{fontSize:10.5,fontFamily:'JetBrains Mono,monospace',color:'#94a3b8',lineHeight:1.7}}>
              {fluide ? <>Poche de {nf(vol,0)} mL<br/>= {nf(vol/poids,1)} mL/kg<br/></>
                      : <>{nf(qte,2)} {drug.unit} / {nf(vol,0)} mL<br/>= {nf(r.conc,3)} {drug.unit}/mL<br/>{solv.base==='pur'?'Non dilué':`Solvant : ${BASE_NOM[solv.base]}`}<br/></>}
              {r.mlh>0 && <>Débit : {nf(r.mlh,1)} mL/h<br/></>}
              Préparé à {heureNow()}
            </div>
          </div>
        )}

        <button onClick={reset} className="perf-reset">↩ Nouvelle perfusion</button>
      </div>

      {/* ── Colonne travail ── */}
      <div className="perf-main">
        <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:5}}>
          <span style={{fontSize:23}}>{PERF_STEPS[step].ic}</span>
          <h2 style={{fontSize:20,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em'}}>{PERF_STEPS[step].t}</h2>
        </div>
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:18,marginLeft:34}}>Étape {step+1} sur {PERF_STEPS.length}</div>

        {/* ─ 0. PATIENT ─ */}
        {step===0&&(
          <div>
            <div className="perf-panel">
              <div className="perf-lbl">Poids du patient</div>
              <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:12}}>
                <input type="range" min="3" max="150" step="1" value={poids} onChange={e=>setPoids(+e.target.value)} style={{flex:1,accentColor:'#22d3ee'}}/>
                <div style={{display:'flex',alignItems:'baseline',gap:4,minWidth:78,justifyContent:'flex-end'}}>
                  <span style={{fontSize:26,fontWeight:900,color:'#22d3ee',fontFamily:'JetBrains Mono,monospace'}}>{poids}</span>
                  <span style={{fontSize:12,color:'var(--muted)',fontWeight:700}}>kg</span>
                </div>
              </div>
              <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                {[{l:'Nourrisson',v:8},{l:'Enfant',v:25},{l:'Adolescent',v:50},{l:'Femme adulte',v:60},{l:'Homme adulte',v:75},{l:'Patient obèse',v:110}].map(p=>(
                  <button key={p.l} onClick={()=>setPoids(p.v)} className="perf-chip" style={poids===p.v?{borderColor:'#22d3ee66',color:'#22d3ee',background:'rgba(34,211,238,0.1)'}:{}}>
                    {p.l} · {p.v} kg
                  </button>
                ))}
              </div>
            </div>
            <div className="perf-note">
              <b>Pourquoi le poids ?</b> La plupart des drogues d’urgence se prescrivent en µg/kg/min ou en mg/kg/h. Une erreur de poids, c’est une erreur de débit — et sur une amine, ça se voit tout de suite sur le scope. En RP, annonce toujours le poids estimé du patient avant de calculer.
            </div>
          </div>
        )}

        {/* ─ 1. MÉDICAMENT ─ */}
        {step===1&&<DrugPicker value={drugId} onPick={pickDrug}/>}

        {/* ─ 2. DILUTION ─ */}
        {step===2&&(!drug ? <div className="perf-empty">Choisis d’abord un médicament à l’étape précédente.</div> : (
          <div>
            <div className="perf-panel" style={{borderColor:drug.color+'33'}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <span style={{fontSize:19}}>{drug.icon}</span>
                <div>
                  <div style={{fontSize:14.5,fontWeight:900,color:'#f1f5f9'}}>{drug.nom}</div>
                  <div style={{fontSize:10.5,color:'var(--muted)',fontFamily:'JetBrains Mono,monospace'}}>{drug.amp} · {drug.dci}</div>
                </div>
              </div>
              <div style={{fontSize:11.5,color:'#94a3b8',lineHeight:1.6}}><b style={{color:drug.color}}>Indication :</b> {drug.indic}</div>
              <div style={{fontSize:11.5,color:'#94a3b8',lineHeight:1.6,marginTop:4}}><b style={{color:drug.color}}>Voie :</b> {drug.voie}</div>
            </div>

            <div className="perf-lbl" style={{marginTop:18}}>Contenant et solvant</div>
            {pretEmploi(drug) ? (
              <div className="perf-note" style={{marginBottom:18}}>
                <b>Prêt à l’emploi.</b> {drug.nom.split('—')[0].trim()} se perfuse tel quel — {drug.amp}. Aucun solvant à ajouter, aucune reconstitution : le diluer fausserait la concentration et, pour certains produits, provoquerait une hémolyse.
              </div>
            ) : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:8,marginBottom:18}}>
              {PERF_SOLVANTS.map(s=>{
                const bad = !!checkSolvant(drug,s);
                const on = solvId===s.id;
                return (
                  <div key={s.id} onClick={()=>setSolv(s.id)} className="perf-solv-card"
                    style={{border:`1px solid ${on?(bad?'#f43f5e88':'#34d39988'):'var(--border)'}`,background:on?(bad?'rgba(244,63,94,0.09)':'rgba(52,211,153,0.07)'):'var(--surface)',opacity:bad&&!on?0.42:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontSize:15}}>{s.icon}</span>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:11.5,fontWeight:700,color:on?(bad?'#f43f5e':'#34d399'):'#cbd5e1',lineHeight:1.3}}>{s.nom}</div>
                        <div style={{fontSize:9.5,color:'#475569',fontFamily:'JetBrains Mono,monospace',marginTop:2}}>{s.tag}{bad?' · incompatible':''}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            )}

            {solvErr && <AlertBox lvl="err" txt={solvErr}/>}

            {solv&&!solvErr&&(
              <>
                {drug.volOptions&&drug.volOptions.length>1&&(
                  <>
                    <div className="perf-lbl">{fluide?'Volume de la poche':'Volume du contenant'}</div>
                    <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:16}}>
                      {drug.volOptions.map(o=>(
                        <button key={o} onClick={()=>setVolSel(o)} className="perf-chip"
                          style={vol===o?{borderColor:drug.color+'88',color:drug.color,background:drug.color+'18'}:{}}>
                          {o} mL{poids>0?` · ${nf(o/poids,1)} mL/kg`:''}
                        </button>
                      ))}
                    </div>
                  </>
                )}

                {!fluide&&(
                  <>
                    <div className="perf-lbl">Quantité de {drug.nom} à diluer</div>
                    <div className="perf-panel">
                      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
                        <input type="number" value={qte} min="0" step={drug.qteStd/10} onChange={e=>setQte(+e.target.value)}
                          style={{width:130,padding:'9px 11px',borderRadius:10,fontSize:14,fontWeight:800,fontFamily:'JetBrains Mono,monospace'}}/>
                        <span style={{fontSize:13,fontWeight:800,color:'var(--muted)'}}>{drug.unit}</span>
                        <button onClick={()=>setQte(drug.qteStd)} className="perf-chip" style={{marginLeft:'auto'}}>↺ Dilution standard SMUR</button>
                      </div>
                      <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
                        <PerfStat label="Volume final" value={nf(vol,0)} unit="mL" color="#38bdf8"/>
                        <PerfStat label="Concentration" value={nf(r.conc,3)} unit={`${drug.unit}/mL`} color={drug.color} big/>
                      </div>
                    </div>
                  </>
                )}

                {fluide&&(
                  <div className="perf-panel">
                    <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
                      <PerfStat label="Volume perfusé" value={nf(vol,0)} unit="mL" color="#38bdf8" big/>
                      <PerfStat label="Rapporté au poids" value={nf(vol/poids,1)} unit="mL/kg" color={drug.color} big/>
                    </div>
                  </div>
                )}

                <div className="perf-note" style={{marginTop:14}}>
                  <b>{fluide?'Repère de dose :':'Dilution de référence :'}</b> {fluide
                    ? drug.objectif
                    : (drug.solvIdeal==='pur'
                      ? `${drug.nom} s’utilise pur — ${nf(drug.qteStd,2)} ${drug.unit} pour ${nf(drug.volStd,0)} mL, sans ajout de solvant.`
                      : `${nf(drug.qteStd,2)} ${drug.unit} dans ${nf(drug.volStd,0)} mL de ${BASE_NOM[drug.solvIdeal]} — c’est la préparation qu’utilisent les équipes SMUR, autant la connaître par cœur.`)}
                </div>
              </>
            )}
          </div>
        ))}

        {/* ─ 3. PRÉPARATION ─ */}
        {step===3&&(!me ? <div className="perf-empty">Complète d’abord le médicament et la dilution.</div> : (
          <div>
            {solvErr&&<AlertBox lvl="err" txt={solvErr}/>}
            <MeLine label="1 · Vérification du produit" texte={me.verif} onCopy={copy} accent={drug.color}/>
            {drug.meExtra&&<MeLine label={`2 · ${drug.meExtra.label}`} texte={drug.meExtra.texte} onCopy={copy} accent={drug.color}/>}
            <MeLine label={`${drug.meExtra?3:2} · ${fluide?'Mise en place de la poche':'Reconstitution / dilution'}`} texte={me.prep} onCopy={copy} accent={drug.color}/>
            <MeLine label={`${drug.meExtra?4:3} · ${fluide?'Traçabilité de la poche':'Étiquetage'}`} texte={me.etiq} onCopy={copy} accent={drug.color}/>
            <div className="perf-lbl" style={{marginTop:18}}>Points de vigilance</div>
            {drug.alertes.map((a,i)=><AlertBox key={i} lvl={i===0?'err':'warn'} txt={a}/>)}
          </div>
        ))}

        {/* ─ 4. BRANCHEMENT ─ */}
        {step===4&&(!me ? <div className="perf-empty">Complète d’abord le médicament et la dilution.</div> : (
          <div>
            <MeLine label="4 · Purge de la ligne" texte={me.purge} onCopy={copy} accent={drug.color}/>
            <MeLine label="5 · Branchement sur la voie" texte={me.branch} onCopy={copy} accent={drug.color}/>
            <div className="perf-note" style={{marginTop:6}}>
              <b>Ne saute jamais la purge.</b> Une ligne non purgée, c’est de l’air injecté au patient — et sur une amine, le volume mort de la tubulure part en bolus dès l’ouverture du clamp. En RP c’est le détail qui fait la différence entre « je branche la perf » et un vrai /me d’infirmier.
            </div>
          </div>
        ))}

        {/* ─ 5. DÉBIT ─ */}
        {step===5&&(!me ? <div className="perf-empty">Complète d’abord le médicament et la dilution.</div> : (
          <div>
            <div className="perf-panel">
              <div className="perf-lbl">{drug.mode==='duree'?'Durée de passage':'Dose prescrite'}</div>
              <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:6}}>
                <input type="range" min={drug.mode==='duree'?Math.max(1,drug.dmin/2):0} max={drug.dmax*1.5} step={drug.step} value={dose} onChange={e=>setDose(+e.target.value)} style={{flex:1,accentColor:drug.color}}/>
                <div style={{display:'flex',alignItems:'baseline',gap:5,minWidth:120,justifyContent:'flex-end'}}>
                  <span style={{fontSize:24,fontWeight:900,color:drug.color,fontFamily:'JetBrains Mono,monospace'}}>{nf(dose,3)}</span>
                  <span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>{drug.dunit}</span>
                </div>
              </div>
              <div style={{fontSize:10.5,color:'#475569',fontFamily:'JetBrains Mono,monospace'}}>
                Fourchette protocole : {nf(drug.dmin,3)} – {nf(drug.dmax,3)} {drug.dunit} · usuel {nf(drug.dusuel,3)}
              </div>
            </div>

            <div style={{display:'flex',gap:9,flexWrap:'wrap',margin:'14px 0'}}>
              <PerfStat label="Débit pousse-seringue" value={nf(r.mlh,1)} unit="mL/h" color="#22d3ee" big/>
              <PerfStat label="Perfuseur 20 gttes/mL" value={nf(r.gttes,0)} unit="gttes/min" color="#a78bfa"/>
              <PerfStat label="Autonomie" value={nf(r.auto,1)} unit="h" color="#34d399"/>
              {fluide
                ? <PerfStat label="Rapporté au poids" value={nf(vol/poids,1)} unit="mL/kg" color={drug.color}/>
                : drug.mode!=='duree'&&<PerfStat label={`Dose horaire`} value={nf(r.mlh*r.conc,2)} unit={`${drug.unit}/h`} color={drug.color}/>}
            </div>

            {alerts.map((a,i)=><AlertBox key={i} lvl={a.lvl} txt={a.txt}/>)}
            {!alerts.length&&<AlertBox lvl="ok" txt={`Prescription cohérente : ${nf(dose,3)} ${drug.dunit} pour ${poids} kg, soit ${nf(r.mlh,1)} mL/h. Objectif : ${drug.objectif}`}/>}

            <div style={{marginTop:16}}>
              <MeLine label="6 · Mise en route du débit" texte={me.debit} onCopy={copy} accent={drug.color}/>
              <MeLine label="7 · Traçabilité & surveillance" texte={me.surv} onCopy={copy} accent={drug.color}/>
            </div>

            <button onClick={copyAll} className="copy-next-btn" disabled={blocked}
              style={{marginTop:8,background:blocked?'rgba(244,63,94,0.08)':`linear-gradient(135deg,${drug.color}22,${drug.color}0a)`,border:`1.5px solid ${blocked?'#f43f5e44':drug.color+'55'}`,color:blocked?'#f43f5e':drug.color,cursor:blocked?'not-allowed':'pointer'}}>
              {blocked?'⛔ Corrige les erreurs avant de copier le protocole':`📋 Copier le protocole complet (${drug.meExtra?8:7} /me)`}
            </button>
          </div>
        ))}

        {/* Navigation */}
        <div style={{display:'flex',gap:10,marginTop:22,paddingTop:16,borderTop:'1px solid var(--border)'}}>
          <button onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0} className="perf-nav" style={{opacity:step===0?0.35:1}}>← Précédent</button>
          <button onClick={()=>setStep(s=>Math.min(PERF_STEPS.length-1,s+1))} disabled={step===PERF_STEPS.length-1||!canNext} className="perf-nav"
            style={{opacity:(step===PERF_STEPS.length-1||!canNext)?0.35:1,borderColor:canNext&&step<PERF_STEPS.length-1?'rgba(34,211,238,0.35)':'var(--border)',color:canNext&&step<PERF_STEPS.length-1?'#22d3ee':'var(--muted)'}}>
            Suivant →
          </button>
        </div>
      </div>
    </div>
  );
}

/* ──────────────────────────────── EXAMEN ──────────────────────────────── */
function PerfExamen({showToast,copy}){
  const [casId,setCas]   = useState(null);
  const [drugId,setDrug] = useState(null);
  const [solvId,setSolv] = useState(null);
  const [qte,setQte]     = useState(0);
  const [dose,setDose]   = useState(0);
  const [volSel,setVolSel] = useState(0);
  const [res,setRes]     = useState(null);
  const [scores,setScores]=useState(()=>load('mRP2_perf_scores',{}));

  useEffect(()=>{save('mRP2_perf_scores',scores);},[scores]);

  const cas  = PERF_CAS.find(c=>c.id===casId);
  const drug = getDrug(drugId);
  const solv = getSolv(solvId);
  const fluide = isFluide(drug);
  const vol  = drug&&solv ? volFinal(drug,solv,volSel) : 0;
  const qteE = fluide ? vol : qte;
  const r    = drug&&vol>0 ? perfCalc(drug,qteE,vol,dose,cas?cas.poids:75) : {conc:0,mlh:0,gttes:0,auto:0};

  const openCas = id => { setCas(id);setDrug(null);setSolv(null);setQte(0);setDose(0);setVolSel(0);setRes(null); };
  const pickDrug = id => { const d=getDrug(id);setDrug(id);setQte(d.qteStd);setDose(d.dusuel);setVolSel(d.volStd);
    setSolv(defaultSolv(d)); };

  const valider = () => {
    if(!cas||!drug||!solv) return;
    const det = [];
    let pts = 0;
    /* Médicament */
    const okD = drug.id===cas.drug;
    pts += okD?40:0;
    det.push({ok:okD, pts:okD?40:0, max:40, lbl:'Choix du médicament',
      txt: okD ? `${drug.nom} — c’est bien le traitement attendu.` : `Tu as choisi ${drug.nom}. Le traitement attendu était : ${getDrug(cas.drug).nom}.`});
    /* Solvant */
    const incompat = checkSolvant(drug,solv);
    let sp = 0, stxt='';
    if(incompat){ sp=0; stxt=`Solvant incompatible — ${incompat}`; }
    else if(solv.base===cas.base||!okD){ sp=25; stxt=`${solv.nom} : solvant correct pour ce produit.`; }
    else { sp=12; stxt=`${BASE_NOM[solv.base]} passe, mais le protocole de référence utilise du ${BASE_NOM[cas.base]}.`; }
    pts += sp;
    det.push({ok:sp===25, pts:sp, max:25, lbl:'Solvant & compatibilité', txt:stxt});
    /* Dose */
    let dp = 0, dtxt='';
    if(!okD){ dp=0; dtxt='Dose non évaluable : le médicament choisi n’est pas celui attendu.'; }
    else if(dose>=cas.doseMin&&dose<=cas.doseMax){ dp=35; dtxt=`${nf(dose,3)} ${drug.dunit} — dans la fourchette attendue (${nf(cas.doseMin,3)} à ${nf(cas.doseMax,3)}).`; }
    else if(dose>=cas.doseMin*0.6&&dose<=cas.doseMax*1.4){ dp=17; dtxt=`${nf(dose,3)} ${drug.dunit} — proche mais hors protocole. Attendu : ${nf(cas.doseMin,3)} à ${nf(cas.doseMax,3)} ${drug.dunit}.`; }
    else { dp=0; dtxt=`${nf(dose,3)} ${drug.dunit} — dangereusement hors cible. Attendu : ${nf(cas.doseMin,3)} à ${nf(cas.doseMax,3)} ${drug.dunit}.`; }
    pts += dp;
    det.push({ok:dp===35, pts:dp, max:35, lbl:'Dose / durée de passage', txt:dtxt});
    /* Malus sécurité */
    const secu = drug&&vol>0 ? checkPresc(drug,qteE,vol,dose,cas.poids,r).filter(a=>a.lvl==='err') : [];
    if(secu.length){ pts = Math.max(0,pts-15); det.push({ok:false, pts:-15, max:0, lbl:'Erreur de sécurité', txt:secu.map(s=>s.txt).join(' ')}); }

    const out = {pts:Math.max(0,Math.min(100,pts)), det};
    setRes(out);
    setScores(s=>({...s,[cas.id]:Math.max(s[cas.id]||0,out.pts)}));
    showToast(out.pts>=80?`Bravo — ${out.pts}/100 !`:`Résultat : ${out.pts}/100`, out.pts>=80?'me':'qu');
  };

  const done = Object.keys(scores).length;
  const moy  = done ? Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/done) : 0;

  return (
    <div className="perf-wrap">
      {/* Liste des cas */}
      <div className="perf-side">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:11,paddingLeft:3}}>
          <span style={{fontSize:9.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--muted)'}}>{PERF_CAS.length} cas cliniques</span>
          {done>0&&<span style={{fontSize:10,fontWeight:800,color:moy>=80?'#34d399':'#fbbf24',fontFamily:'JetBrains Mono,monospace'}}>moy {moy}</span>}
        </div>
        {PERF_CAS.map(c=>{
          const on = casId===c.id;
          const sc = scores[c.id];
          const dc = c.diff==='Facile'?'#34d399':c.diff==='Standard'?'#fbbf24':'#f43f5e';
          return (
            <div key={c.id} onClick={()=>openCas(c.id)} className="perf-cas-card"
              style={{border:`1px solid ${on?'rgba(34,211,238,0.45)':'var(--border)'}`,background:on?'rgba(34,211,238,0.07)':'var(--surface)'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <span style={{fontSize:14}}>{c.icon}</span>
                <span style={{fontSize:12,fontWeight:800,color:on?'#22d3ee':'#cbd5e1',lineHeight:1.25,flex:1}}>{c.titre}</span>
                {sc!==undefined&&<span style={{fontSize:9.5,fontWeight:900,color:sc>=80?'#34d399':sc>=50?'#fbbf24':'#f43f5e',fontFamily:'JetBrains Mono,monospace'}}>{sc}</span>}
              </div>
              <span style={{fontSize:9,fontWeight:800,color:dc,textTransform:'uppercase',letterSpacing:'0.08em'}}>{c.diff}</span>
            </div>
          );
        })}
      </div>

      {/* Zone d'examen */}
      <div className="perf-main">
        {!cas ? (
          <div className="perf-empty" style={{marginTop:60}}>
            <div style={{fontSize:52,marginBottom:14}}>🎓</div>
            <div style={{fontSize:17,fontWeight:800,color:'#475569',marginBottom:8}}>Choisis un cas clinique</div>
            <div style={{fontSize:12.5,color:'#334155',lineHeight:1.7,maxWidth:400,margin:'0 auto'}}>
              On te donne une situation, tu montes la perfusion : le bon produit, le bon solvant, la bonne dilution et le bon débit. L’appli corrige et explique.
            </div>
          </div>
        ) : (
          <>
            <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:12}}>
              <span style={{fontSize:24}}>{cas.icon}</span>
              <div>
                <h2 style={{fontSize:20,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em'}}>{cas.titre}</h2>
                <div style={{fontSize:11,color:'var(--muted)',fontFamily:'JetBrains Mono,monospace',marginTop:2}}>Patient de {cas.poids} kg · niveau {cas.diff.toLowerCase()}</div>
              </div>
            </div>

            <div className="perf-enonce">{cas.enonce}</div>

            {!res ? (
              <>
                <div className="perf-lbl" style={{marginTop:20}}>1 · Quel produit perfuses-tu ?</div>
                <div style={{maxHeight:drugId?200:'none',overflowY:drugId?'auto':'visible',marginBottom:6,paddingRight:4}}>
                  <DrugPicker value={drugId} onPick={pickDrug}/>
                </div>

                {drug&&(
                  <>
                    <div className="perf-lbl" style={{marginTop:16}}>2 · {pretEmploi(drug)?'Conditionnement':'Solvant et dilution'}</div>
                    {pretEmploi(drug) ? (
                      <div className="perf-note" style={{marginBottom:12}}>
                        <b>Prêt à l’emploi</b> — {drug.amp}. Rien à diluer, il ne reste qu’à choisir le volume et la vitesse de passage.
                      </div>
                    ) : (
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(185px,1fr))',gap:8,marginBottom:12}}>
                      {PERF_SOLVANTS.map(s=>{
                        const on=solvId===s.id;
                        return (
                          <div key={s.id} onClick={()=>setSolv(s.id)} className="perf-solv-card"
                            style={{border:`1px solid ${on?'rgba(34,211,238,0.5)':'var(--border)'}`,background:on?'rgba(34,211,238,0.08)':'var(--surface)'}}>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                              <span style={{fontSize:14}}>{s.icon}</span>
                              <div style={{minWidth:0}}>
                                <div style={{fontSize:11,fontWeight:700,color:on?'#22d3ee':'#cbd5e1',lineHeight:1.3}}>{s.nom}</div>
                                <div style={{fontSize:9.5,color:'#475569',fontFamily:'JetBrains Mono,monospace',marginTop:2}}>{s.tag}</div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    )}
                    {drug.volOptions&&drug.volOptions.length>1&&(
                      <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:10}}>
                        {drug.volOptions.map(o=>(
                          <button key={o} onClick={()=>setVolSel(o)} className="perf-chip"
                            style={vol===o?{borderColor:'rgba(34,211,238,0.5)',color:'#22d3ee',background:'rgba(34,211,238,0.1)'}:{}}>
                            {o} mL · {nf(o/cas.poids,1)} mL/kg
                          </button>
                        ))}
                      </div>
                    )}
                    <div className="perf-panel">
                      {fluide ? (
                        <div style={{display:'flex',alignItems:'center',gap:11,flexWrap:'wrap',fontSize:11.5,color:'#475569'}}>
                          <span style={{fontWeight:700,color:'var(--muted)'}}>Volume :</span>
                          <b style={{color:'#22d3ee',fontSize:14,fontFamily:'JetBrains Mono,monospace'}}>{nf(vol,0)} mL</b>
                          <span>soit <b style={{color:'#22d3ee'}}>{nf(vol/cas.poids,1)} mL/kg</b> pour {cas.poids} kg</span>
                        </div>
                      ) : (
                        <div style={{display:'flex',alignItems:'center',gap:11,flexWrap:'wrap'}}>
                          <span style={{fontSize:11.5,fontWeight:700,color:'var(--muted)'}}>Quantité :</span>
                          <input type="number" value={qte} min="0" step={drug.qteStd/10} onChange={e=>setQte(+e.target.value)}
                            style={{width:110,padding:'8px 10px',borderRadius:9,fontSize:13,fontWeight:800,fontFamily:'JetBrains Mono,monospace'}}/>
                          <span style={{fontSize:12,fontWeight:800,color:'var(--muted)'}}>{drug.unit}</span>
                          <span style={{fontSize:11.5,color:'#475569'}}>dans {nf(vol,0)} mL → <b style={{color:'#22d3ee'}}>{nf(r.conc,3)} {drug.unit}/mL</b></span>
                        </div>
                      )}
                    </div>

                    <div className="perf-lbl" style={{marginTop:16}}>3 · {drug.mode==='duree'?'Durée de passage':'Dose prescrite'}</div>
                    <div className="perf-panel">
                      <div style={{display:'flex',alignItems:'center',gap:14}}>
                        <input type="range" min={drug.mode==='duree'?Math.max(1,drug.dmin/2):0} max={drug.dmax*1.5} step={drug.step} value={dose} onChange={e=>setDose(+e.target.value)} style={{flex:1,accentColor:'#22d3ee'}}/>
                        <div style={{display:'flex',alignItems:'baseline',gap:5,minWidth:120,justifyContent:'flex-end'}}>
                          <span style={{fontSize:22,fontWeight:900,color:'#22d3ee',fontFamily:'JetBrains Mono,monospace'}}>{nf(dose,3)}</span>
                          <span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>{drug.dunit}</span>
                        </div>
                      </div>
                      <div style={{marginTop:11,display:'flex',gap:9,flexWrap:'wrap'}}>
                        <PerfStat label="Débit" value={nf(r.mlh,1)} unit="mL/h" color="#22d3ee" big/>
                        <PerfStat label="Gouttes" value={nf(r.gttes,0)} unit="gttes/min" color="#a78bfa"/>
                      </div>
                    </div>

                    <button onClick={valider} className="copy-next-btn" style={{marginTop:16,background:'linear-gradient(135deg,#0891b2,#4f46e5)',color:'white',border:'none'}}>
                      ✅ Valider ma prescription
                    </button>
                  </>
                )}
              </>
            ) : (
              <div style={{marginTop:18}}>
                <div className="perf-score" style={{borderColor:(res.pts>=80?'#34d399':res.pts>=50?'#fbbf24':'#f43f5e')+'44',background:(res.pts>=80?'rgba(52,211,153,':res.pts>=50?'rgba(251,191,36,':'rgba(244,63,94,')+'0.07)'}}>
                  <div style={{fontSize:42,fontWeight:900,color:res.pts>=80?'#34d399':res.pts>=50?'#fbbf24':'#f43f5e',fontFamily:'JetBrains Mono,monospace',lineHeight:1}}>{res.pts}<span style={{fontSize:17,opacity:0.5}}>/100</span></div>
                  <div style={{fontSize:13,fontWeight:800,color:'#cbd5e1',marginTop:6}}>
                    {res.pts>=90?'Parfait — prescription conforme au protocole.':res.pts>=80?'Très bien, quelques détails à peaufiner.':res.pts>=50?'Passable : relis la correction, il y a un vrai écart.':'À revoir entièrement — cette perfusion aurait été dangereuse.'}
                  </div>
                </div>

                {res.det.map((d,i)=>(
                  <div key={i} className="perf-detail" style={{borderColor:(d.ok?'#34d399':d.pts>0?'#fbbf24':'#f43f5e')+'33'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5,gap:10}}>
                      <span style={{fontSize:11.5,fontWeight:800,color:d.ok?'#34d399':d.pts>0?'#fbbf24':'#f43f5e'}}>{d.ok?'✓':d.pts>0?'~':'✗'} {d.lbl}</span>
                      <span style={{fontSize:11,fontWeight:900,color:'var(--muted)',fontFamily:'JetBrains Mono,monospace',flexShrink:0}}>{d.pts>0?'+':''}{d.pts}{d.max?` / ${d.max}`:''}</span>
                    </div>
                    <div style={{fontSize:11.5,color:'#94a3b8',lineHeight:1.6}}>{d.txt}</div>
                  </div>
                ))}

                <div className="perf-lbl" style={{marginTop:18}}>Correction détaillée</div>
                <div className="perf-note" style={{lineHeight:1.75}}>{cas.corr}</div>

                <div style={{display:'flex',gap:9,marginTop:16,flexWrap:'wrap'}}>
                  <button onClick={()=>{setRes(null);}} className="perf-nav" style={{flex:1,minWidth:150}}>↩ Refaire ce cas</button>
                  <button onClick={()=>{const i=PERF_CAS.findIndex(c=>c.id===casId);openCas(PERF_CAS[(i+1)%PERF_CAS.length].id);}} className="perf-nav" style={{flex:1,minWidth:150,borderColor:'rgba(34,211,238,0.35)',color:'#22d3ee'}}>Cas suivant →</button>
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────── CONTENEUR ─────────────────────────────── */
function PerfusionView({showToast}){
  const [mode,setMode]=useState('atelier');
  const copy = useCallback(async txt=>{
    try{ await navigator.clipboard.writeText(txt); }
    catch{ const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove(); }
    showToast('/me copié dans le presse-papiers !','me');
  },[showToast]);

  return (
    <div style={{display:'flex',flex:1,flexDirection:'column',overflow:'hidden',minHeight:0}}>
      <div className="perf-modebar">
        {[{k:'atelier',ic:'🧪',t:'Atelier de préparation',d:'Monte ta perfusion étape par étape'},
          {k:'examen', ic:'🎓',t:'Mode examen',           d:`${PERF_CAS.length} cas cliniques notés`}].map(m=>(
          <button key={m.k} onClick={()=>setMode(m.k)} className="perf-modebtn"
            style={mode===m.k?{borderColor:'rgba(34,211,238,0.45)',background:'rgba(34,211,238,0.09)',color:'#22d3ee'}:{}}>
            <span style={{fontSize:15}}>{m.ic}</span>
            <span style={{textAlign:'left'}}>
              <span style={{display:'block',fontSize:12.5,fontWeight:800}}>{m.t}</span>
              <span style={{display:'block',fontSize:10,opacity:0.65,fontWeight:600,marginTop:1}}>{m.d}</span>
            </span>
          </button>
        ))}
      </div>
      {mode==='atelier'?<PerfAtelier showToast={showToast} copy={copy}/>:<PerfExamen showToast={showToast} copy={copy}/>}
    </div>
  );
}

/* ═══════════════════════════════════════════ SESSION ══ */
function SessionView({log,onUpdateTime,onDelete,active,onToggleActive,onClear,showToast,onClose}){
  const copyResume=useCallback(async()=>{
    const txt=log.map(e=>`[${e.heure}] /${e.type} ${e.texte.replace(/^\/(me|qu)\s*/,'')}`).join('\n');
    try{ await navigator.clipboard.writeText(txt); }
    catch{ const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove(); }
    showToast('Résumé copié dans le presse-papiers !','me');
  },[log,showToast]);

  return(
    <div style={{display:'flex',flex:1,flexDirection:'column',overflow:'hidden',minHeight:0}}>
      <div style={{padding:'16px 20px 12px',borderBottom:'1px solid var(--border)',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:4,height:26,borderRadius:99,background:'var(--green)',boxShadow:'0 0 12px var(--green)'}}/>
          <div>
            <h1 style={{fontSize:19,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em'}}>🕒 Résumé de session</h1>
            <p style={{fontSize:12,color:'var(--muted)',marginTop:2,fontFamily:'JetBrains Mono'}}>{log.length} action{log.length!==1?'s':''} copiée{log.length!==1?'s':''}{active?' · enregistrement actif':' · enregistrement en pause'}</p>
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button onClick={onToggleActive} style={{background:active?'rgba(52,211,153,0.12)':'var(--surface)',border:`1px solid ${active?'rgba(52,211,153,0.3)':'var(--border)'}`,color:active?'var(--green)':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,fontFamily:'Inter,sans-serif'}}>
            {active?'⏸ Mettre en pause':"▶ Reprendre l'enregistrement"}
          </button>
          <button onClick={copyResume} disabled={log.length===0} style={{background:'var(--surface)',border:'1px solid var(--border)',color:log.length===0?'var(--faint)':'var(--text)',padding:'8px 14px',borderRadius:10,cursor:log.length===0?'not-allowed':'pointer',fontSize:12.5,fontWeight:700,fontFamily:'Inter,sans-serif',display:'flex',alignItems:'center',gap:7}}>
            <Ic.Copy/> Copier le résumé
          </button>
          <button onClick={()=>{if(log.length===0||confirm('Vider tout le résumé de session ?'))onClear();}} style={{background:'var(--surface)',border:'1px solid var(--border)',color:'var(--red)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,fontFamily:'Inter,sans-serif',display:'flex',alignItems:'center',gap:7}}>
            <Ic.Trash/> Vider
          </button>
          <button onClick={onClose} style={{background:'var(--surface)',border:'1px solid var(--border)',color:'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,fontFamily:'Inter,sans-serif',display:'flex',alignItems:'center',gap:7}}>
            <Ic.X s={14}/> Fermer
          </button>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'16px 20px 24px'}}>
        {log.length===0?(
          <div style={{textAlign:'center',padding:'80px 20px',color:'var(--muted)'}}>
            <div style={{fontSize:34,marginBottom:10}}>🕒</div>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>Aucune action copiée pour l'instant</div>
            <div style={{fontSize:12.5,marginTop:6,maxWidth:380,marginLeft:'auto',marginRight:'auto',lineHeight:1.6}}>
              {active?"Continue à copier des /me et /qu dans les autres onglets : elles apparaîtront ici automatiquement avec leur heure.":"L'enregistrement est en pause. Clique sur « Reprendre l'enregistrement » pour recommencer à capturer tes copies."}
            </div>
          </div>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {log.map(e=>(
              <div key={e.id} style={{display:'flex',alignItems:'flex-start',gap:12,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 12px'}}>
                <input type="time" value={e.heure} onChange={ev=>onUpdateTime(e.id,ev.target.value)}
                  style={{background:'var(--bg3)',border:'1px solid var(--border2)',color:'var(--text)',borderRadius:7,padding:'5px 7px',fontSize:12,fontFamily:'JetBrains Mono,monospace',flexShrink:0,colorScheme:'dark'}}/>
                <div style={{flex:1,minWidth:0}}>
                  <span className={e.type==='me'?'chip-me':'chip-qu'}>{e.type==='me'?'/me':'/qu'} · {e.categorie==='Questions /qu'?'Question':e.categorie}</span>
                  <div style={{fontSize:12.5,fontWeight:700,color:'#e2e8f0',marginTop:5}}>{e.titre}</div>
                  <div style={{fontSize:11,color:'#334155',fontFamily:'JetBrains Mono,monospace',marginTop:2,lineHeight:1.5}}>{e.texte}</div>
                </div>
                <button onClick={()=>onDelete(e.id)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--faint)',padding:'5px',borderRadius:6,flexShrink:0}} onMouseEnter={ev=>ev.currentTarget.style.color='var(--red)'} onMouseLeave={ev=>ev.currentTarget.style.color='var(--faint)'}><Ic.Trash/></button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════ APP ══ */
function App(){
  const [custom,setCustom]=useState(()=>load('mRP2_custom',[]));
  const [favs,setFavs]=useState(()=>load('mRP2_favs',[]));
  const [cat,setCat]=useState('Tous');
  const [q,setQ]=useState('');
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState({msg:'',show:false,type:'me'});
  const [sidebar,setSidebar]=useState(false);
  const [view,setView]=useState('macros'); // 'macros' | 'body'
  const [sessionActive,setSessionActive]=useState(()=>load('mRP2_sessionActive',false));
  const [sessionLog,setSessionLog]=useState(()=>load('mRP2_sessionLog',[]));
  const searchRef=useRef(null);
  const timerRef=useRef(null);

  const all=useMemo(()=>[...DEFAULT_MACROS,...custom],[custom]);
  const filtered=useMemo(()=>{
    let list=all;
    if(cat==='Favoris')list=list.filter(m=>favs.includes(m.id));
    else if(cat!=='Tous')list=list.filter(m=>m.categorie===cat);
    if(q){const lq=q.toLowerCase();list=list.filter(m=>m.titre.toLowerCase().includes(lq)||m.texte.toLowerCase().includes(lq)||m.categorie.toLowerCase().includes(lq));}
    return [...list].sort((a,b)=>(favs.includes(b.id)?1:0)-(favs.includes(a.id)?1:0));
  },[all,cat,q,favs]);

  const counts=useMemo(()=>{
    const c={};
    CATEGORIES.forEach(k=>{if(k==='Tous')c[k]=all.length;else if(k==='Favoris')c[k]=favs.length;else c[k]=all.filter(m=>m.categorie===k).length;});
    return c;
  },[all,favs]);

  useEffect(()=>{save('mRP2_custom',custom);},[custom]);
  useEffect(()=>{save('mRP2_favs',favs);},[favs]);
  useEffect(()=>{save('mRP2_sessionActive',sessionActive);},[sessionActive]);
  useEffect(()=>{save('mRP2_sessionLog',sessionLog);},[sessionLog]);

  useEffect(()=>{
    const h=e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(view==='body')setView('macros');searchRef.current?.focus();searchRef.current?.select();}
      if((e.ctrlKey||e.metaKey)&&e.key==='1'){e.preventDefault();setCat('Cathéters');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='2'){e.preventDefault();setCat('Monitoring');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='3'){e.preventDefault();setCat('Réanimation');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='4'){e.preventDefault();setCat('Questions /qu');setView('macros');}
      if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();setView(v=>v==='body'?'macros':'body');}
      if((e.ctrlKey||e.metaKey)&&e.key==='p'){e.preventDefault();setView(v=>v==='procedures'?'macros':'procedures');}
      if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();setView(v=>v==='perfusion'?'macros':'perfusion');}
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();setSessionActive(true);setView(v=>v==='session'?'macros':'session');}
      if(e.key==='Escape'){setModal(null);setSidebar(false);}
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[view,sessionActive]);

  const showToast=useCallback((msg,type='me')=>{
    if(timerRef.current)clearTimeout(timerRef.current);
    setToast({msg,show:true,type});
    timerRef.current=setTimeout(()=>setToast(t=>({...t,show:false})),2700);
  },[]);

  const handleCopy=useCallback(async macro=>{
    const t=isME(macro)?'me':'qu';
    try{await navigator.clipboard.writeText(macro.texte);}
    catch{const el=document.createElement('textarea');el.value=macro.texte;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();}
    showToast(`/${t} copié dans le presse-papiers !`,t);
    if(sessionActive){
      setSessionLog(log=>[...log,{id:uid(),type:t,titre:macro.titre,texte:macro.texte,categorie:macro.categorie,heure:nowHM()}]);
    }
  },[showToast,sessionActive]);

  const handleFav=useCallback(id=>setFavs(f=>f.includes(id)?f.filter(x=>x!==id):[...f,id]),[]);
  const handleDel=useCallback(id=>{setCustom(c=>c.filter(m=>m.id!==id));setFavs(f=>f.filter(x=>x!==id));},[]);
  const handleSave=useCallback(m=>{setCustom(c=>[...c,m]);showToast('Macro créée !',m.type||'me');},[showToast]);
  const handleAdd=useCallback(ms=>{setCustom(c=>[...c,...ms]);showToast(`${ms.length} macro(s) ajoutée(s) !`,ms[0]?.type||'me');},[showToast]);

  const openSession=useCallback(()=>{setSessionActive(true);setView(v=>v==='session'?'macros':'session');},[]);
  const toggleSessionActive=useCallback(()=>setSessionActive(a=>!a),[]);
  const updateSessionTime=useCallback((id,heure)=>setSessionLog(log=>log.map(e=>e.id===id?{...e,heure}:e)),[]);
  const deleteSessionEntry=useCallback(id=>setSessionLog(log=>log.filter(e=>e.id!==id)),[]);
  const clearSessionLog=useCallback(()=>setSessionLog([]),[]);

  const isBodyView=view==='body';
  const isProcView=view==='procedures';
  const isPerfView=view==='perfusion';
  const isSessionView=view==='session';

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {sidebar&&<div onClick={()=>setSidebar(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:50,backdropFilter:'blur(4px)'}}/>}

      {/* ════ SIDEBAR ════ */}
      <aside className={`sidebar ${sidebar?'open':''}`} style={{width:234,flexShrink:0,display:'flex',flexDirection:'column',height:'100vh',overflowY:'auto'}}>
        {/* Logo */}
        <div style={{borderBottom:'1px solid var(--border)'}}>
          {/* ── vLifeRoleplay logo ── */}
          <div className="vlife-logo-bar">
            {/* subtle cyan glow behind logo */}
            <div style={{position:'absolute',top:-20,left:-20,width:80,height:80,borderRadius:'50%',background:'rgba(34,211,238,0.06)',pointerEvents:'none'}}/>
            <svg viewBox="0 0 202 68" width="202" height="68" style={{display:'block',overflow:'visible'}}>
              {/* ── i mark (dot + stem stylisé) ── */}
              <rect x="0" y="0" width="10" height="3" rx="1" fill="white"/>
              <rect x="0" y="6" width="10" height="28" rx="1" fill="white"/>
              {/* ── V ── */}
              <polygon points="16,0 28,0 36,26 44,0 56,0 42,34 30,34" fill="white"/>
              {/* ── L ── */}
              <rect x="60" y="0" width="11" height="34" rx="1" fill="white"/>
              <rect x="60" y="25" width="22" height="9" rx="1" fill="white"/>
              {/* ── I ── */}
              <rect x="86" y="0" width="11" height="34" rx="1" fill="white"/>
              {/* ── F ── */}
              <rect x="101" y="0" width="11" height="34" rx="1" fill="white"/>
              <rect x="101" y="0" width="22" height="9" rx="1" fill="white"/>
              <rect x="101" y="13" width="18" height="8" rx="1" fill="white"/>
              {/* ── E ── */}
              <rect x="127" y="0" width="11" height="34" rx="1" fill="white"/>
              <rect x="127" y="0" width="22" height="9" rx="1" fill="white"/>
              <rect x="127" y="13" width="18" height="8" rx="1" fill="white"/>
              <rect x="127" y="25" width="22" height="9" rx="1" fill="white"/>
              {/* ── ROLEPLAY ── */}
              <text x="0" y="62" fontFamily="Inter,sans-serif" fontWeight="900" fontSize="19" fill="white" letterSpacing="2.5">ROLEPLAY</text>
            </svg>
          </div>
          {/* ── MedRP / SAMU 93 sub-brand ── */}
          <div style={{padding:'11px 16px 13px',display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,borderRadius:10,background:'linear-gradient(135deg,#0891b2,#4f46e5)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0,boxShadow:'0 0 16px rgba(8,145,178,0.35)'}}>⚕️</div>
            <div>
              <div style={{fontSize:14,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em',lineHeight:1.2}}>MedRP</div>
              <div style={{fontSize:9.5,color:'var(--muted)',fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',marginTop:1}}>SAMU 93 · SMUR</div>
            </div>
          </div>
        </div>

        {/* Stats */}
        <div style={{display:'flex',padding:'9px 12px',gap:6,borderBottom:'1px solid var(--border)'}}>
          {[['me',all.filter(m=>isME(m)).length,'#22d3ee','rgba(34,211,238,0.08)'],['qu',all.filter(m=>!isME(m)).length,'#a78bfa','rgba(167,139,250,0.08)']].map(([t,n,c,bg])=>(
            <div key={t} style={{flex:1,background:bg,border:`1px solid ${c}22`,borderRadius:9,padding:'7px 10px',textAlign:'center'}}>
              <div style={{fontSize:17,fontWeight:900,color:c,lineHeight:1}}>{n}</div>
              <div style={{fontSize:8.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.1em',color:c,opacity:0.6,fontFamily:'JetBrains Mono',marginTop:2}}>/{t}</div>
            </div>
          ))}
          <div style={{flex:1,background:'rgba(251,191,36,0.06)',border:'1px solid rgba(251,191,36,0.15)',borderRadius:9,padding:'7px 10px',textAlign:'center'}}>
            <div style={{fontSize:17,fontWeight:900,color:'#fbbf24',lineHeight:1}}>{all.length}</div>
            <div style={{fontSize:8.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.1em',color:'#fbbf24',opacity:0.6,fontFamily:'JetBrains Mono',marginTop:2}}>total</div>
          </div>
        </div>

        {/* Nav */}
        <div style={{padding:'14px 10px 6px',flex:1}}>
          {/* Body schema button */}
          <button onClick={()=>{setView(v=>v==='body'?'macros':'body');setSidebar(false);}}
            className={`cat-btn ${isBodyView?'active-body':''}`}>
            <span><span style={{marginRight:8}}>🫀</span>Schéma corporel</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+B</span>
          </button>

          {/* Procedures button */}
          <button onClick={()=>{setView(v=>v==='procedures'?'macros':'procedures');setSidebar(false);}}
            className={`cat-btn ${isProcView?'active-body':''}`}
            style={isProcView?{background:'rgba(139,92,246,0.08)',color:'#a78bfa'}:{}}>
            <span><span style={{marginRight:8}}>🗂️</span>Procédures guidées</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+P</span>
          </button>

          {/* Perfusion button */}
          <button onClick={()=>{setView(v=>v==='perfusion'?'macros':'perfusion');setSidebar(false);}}
            className={`cat-btn ${isPerfView?'active':''}`}
            style={isPerfView?{background:'rgba(56,189,248,0.09)',color:'#38bdf8'}:{}}>
            <span><span style={{marginRight:8}}>🧪</span>Faire ma perfusion</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+I</span>
          </button>

          {/* Session button */}
          <button onClick={()=>{openSession();setSidebar(false);}}
            className={`cat-btn ${isSessionView?'active':''}`}
            style={isSessionView?{background:'rgba(52,211,153,0.09)',color:'var(--green)'}:{}}>
            <span><span style={{marginRight:8}}>🕒</span>Mode session{sessionLog.length>0?` (${sessionLog.length})`:''}</span>
            <span className="key-tag" style={{fontSize:9}}>Ctrl+S</span>
          </button>

          <div style={{height:1,background:'var(--border)',margin:'10px 4px'}}/>

          <div className="section-label">/me — Actions</div>
          {CATEGORIES.filter(c=>c!=='Todos'&&c!=='Favoris'&&c!=='Questions /qu'&&c!=='Autres').map(c=>(
            <button key={c} onClick={()=>{setCat(c);setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat===c?'active':''}`}>
              <span><span style={{marginRight:8}}>{CAT_ICON[c]}</span>{c}</span>
              <span className="badge">{counts[c]||0}</span>
            </button>
          ))}

          <button onClick={()=>{setCat('Examens');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Examens'?'active':''}`}>
            <span><span style={{marginRight:8}}>🔬</span>Examens</span>
            <span className="badge">{counts['Examens']||0}</span>
          </button>

          <div style={{height:1,background:'var(--border)',margin:'10px 4px'}}/>
          <div style={{fontSize:9,fontWeight:800,color:'var(--qu)',textTransform:'uppercase',letterSpacing:'0.1em',padding:'4px 12px 4px',opacity:0.8}}>/qu — Questions</div>
          <button onClick={()=>{setCat('Questions /qu');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Questions /qu'?'active-qu':''}`}>
            <span><span style={{marginRight:8}}>💬</span>Questions /qu</span>
            <span className="badge">{counts['Questions /qu']||0}</span>
          </button>
          <button onClick={()=>{setCat('Autres');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Autres'?'active':''}`}>
            <span><span style={{marginRight:8}}>📋</span>Autres</span>
            <span className="badge">{counts['Autres']||0}</span>
          </button>

          <div style={{height:1,background:'var(--border)',margin:'10px 4px'}}/>
          <button onClick={()=>{setCat('Tous');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Tous'?'active':''}`}>
            <span><span style={{marginRight:8}}>🏥</span>Toutes les macros</span>
            <span className="badge">{counts['Tous']||0}</span>
          </button>
          <button onClick={()=>{setCat('Favoris');setView('macros');setSidebar(false);}} className={`cat-btn ${view==='macros'&&cat==='Favoris'?'active':''}`}>
            <span><span style={{marginRight:8}}>⭐</span>Favoris</span>
            <span className="badge" style={{color:'var(--gold)'}}>{counts['Favoris']||0}</span>
          </button>
        </div>

        {/* Actions */}
        <div style={{padding:'12px 10px',borderTop:'1px solid var(--border)'}}>
          <div className="section-label">Actions</div>
          <button className="action-btn" onClick={()=>setModal('create')} style={{color:'var(--me)'}}><Ic.Plus/> Créer une macro</button>
          <button className="action-btn" onClick={()=>setModal('pdf')} style={{color:'var(--qu)'}}><Ic.Upload/> Importer un PDF</button>
          <button className="action-btn" onClick={()=>setModal('gen')} style={{color:'var(--green)'}}><Ic.Spark/> Générer des macros</button>
        </div>

        {/* Shortcuts */}
        <div style={{padding:'12px 14px 18px',borderTop:'1px solid var(--border)'}}>
          <div className="section-label">Raccourcis</div>
          {[['Ctrl+K','Recherche'],['Ctrl+B','Schéma corp.'],['Ctrl+P','Procédures'],['Ctrl+1','Cathéters'],['Ctrl+2','Monitoring'],['Ctrl+3','Réanimation'],['Ctrl+4','Questions /qu'],['Échap','Fermer']].map(([k,l])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,color:'#334155',marginBottom:5}}>
              <span>{l}</span><span className="key-tag">{k}</span>
            </div>
          ))}
        </div>
      </aside>

      {/* ════ MAIN ════ */}
      <main style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',minWidth:0,background:'var(--bg)'}}>

        {/* Top bar */}
        <div className="topbar">
          <button onClick={()=>setSidebar(s=>!s)} style={{background:'var(--surface)',border:'1px solid var(--border)',color:'var(--muted)',padding:'8px',borderRadius:9,cursor:'pointer',alignItems:'center',display:'none'}} className="mobile-menu"><Ic.Menu/></button>

          {/* Body view toggle chip */}
          <button onClick={()=>setView(v=>v==='body'?'macros':'body')} style={{background:isBodyView?'rgba(251,191,36,0.12)':'var(--surface)',border:`1px solid ${isBodyView?'rgba(251,191,36,0.3)':'var(--border)'}`,color:isBodyView?'var(--gold)':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🫀 {isBodyView?'Fermer schéma':'Schéma corporel'}
          </button>

          {/* Procedures toggle chip */}
          <button onClick={()=>setView(v=>v==='procedures'?'macros':'procedures')} style={{background:isProcView?'rgba(139,92,246,0.12)':'var(--surface)',border:`1px solid ${isProcView?'rgba(139,92,246,0.3)':'var(--border)'}`,color:isProcView?'#a78bfa':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🗂️ {isProcView?'Fermer procédures':'Procédures guidées'}
          </button>

          {/* Perfusion toggle chip */}
          <button onClick={()=>setView(v=>v==='perfusion'?'macros':'perfusion')} style={{background:isPerfView?'rgba(56,189,248,0.12)':'var(--surface)',border:`1px solid ${isPerfView?'rgba(56,189,248,0.3)':'var(--border)'}`,color:isPerfView?'#38bdf8':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🧪 {isPerfView?'Fermer perfusion':'Faire ma perfusion'}
          </button>

          {/* Session toggle chip */}
          <button onClick={openSession} style={{background:isSessionView?'rgba(52,211,153,0.12)':'var(--surface)',border:`1px solid ${isSessionView?'rgba(52,211,153,0.3)':'var(--border)'}`,color:isSessionView?'var(--green)':'var(--muted)',padding:'8px 14px',borderRadius:10,cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7,flexShrink:0,fontFamily:'Inter,sans-serif',transition:'all 0.15s'}}>
            🕒 {isSessionView?'Fermer session':sessionActive?`Session (${sessionLog.length})`:'Mode session'}
          </button>

          {!isBodyView&&!isProcView&&!isPerfView&&!isSessionView&&<>
            <div style={{position:'relative',flex:1,maxWidth:500}}>
              <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',color:'var(--muted)',pointerEvents:'none'}}><Ic.Search/></span>
              <input ref={searchRef} type="text" placeholder="Rechercher /me ou /qu… (Ctrl+K)" value={q} onChange={e=>setQ(e.target.value)} style={{...INP,paddingLeft:38,paddingRight:36,borderRadius:12,width:'100%'}}/>
              {q&&<button onClick={()=>setQ('')} style={{position:'absolute',right:11,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'var(--muted)',cursor:'pointer',padding:'3px',borderRadius:5}}><Ic.X s={14}/></button>}
            </div>
            <button className="create-btn" onClick={()=>setModal('create')}><Ic.Plus/> Créer</button>
          </>}
        </div>

        {/* Content */}
        {isBodyView ? (
          <BodySchema showToast={showToast}/>
        ) : isProcView ? (
          <ProceduresView showToast={showToast}/>
        ) : isPerfView ? (
          <PerfusionView showToast={showToast}/>
        ) : isSessionView ? (
          <SessionView log={sessionLog} onUpdateTime={updateSessionTime} onDelete={deleteSessionEntry}
            active={sessionActive} onToggleActive={toggleSessionActive} onClear={clearSessionLog}
            showToast={showToast} onClose={()=>setView('macros')}/>
        ) : (
          <>
            <div style={{padding:'16px 20px 12px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:4,height:26,borderRadius:99,background:cat==='Questions /qu'?'var(--qu)':'var(--me)',boxShadow:`0 0 12px ${cat==='Questions /qu'?'var(--qu)':'var(--me)'}`}}/>
                <div>
                  <h1 style={{fontSize:19,fontWeight:900,color:'#f1f5f9',letterSpacing:'-0.03em'}}>{CAT_ICON[cat]} {cat}</h1>
                  <p style={{fontSize:12,color:'var(--muted)',marginTop:2,fontFamily:'JetBrains Mono'}}>{filtered.length} macro{filtered.length!==1?'s':''}{q?` · « ${q} »`:''}</p>
                </div>
              </div>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'16px 20px 24px'}}>
              {filtered.length===0?(
                <div style={{textAlign:'center',padding:'80px 20px',color:'var(--muted)'}}>
                  <div style={{fontSize:52,marginBottom:16}}>{q?'🔍':'✏️'}</div>
                  <div style={{fontSize:16,fontWeight:800,color:'#475569',marginBottom:8}}>{q?'Aucune macro trouvée':'Aucune macro ici'}</div>
                  <div style={{fontSize:13,color:'#334155'}}>{q?`Aucun résultat pour « ${q} »`:'Créez votre première macro avec le bouton + Créer'}</div>
                </div>
              ):(
                <div className="macros-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(288px,1fr))',gap:10}}>
                  {filtered.map(m=><MacroCard key={m.id} macro={m} isFav={favs.includes(m.id)} onCopy={handleCopy} onFav={handleFav} onDelete={handleDel}/>)}
                </div>
              )}
            </div>
          </>
        )}
      </main>

      {modal==='create'&&<CreateModal onClose={()=>setModal(null)} onSave={handleSave}/>}
      {modal==='pdf'&&<PdfModal onClose={()=>setModal(null)} onImport={handleAdd}/>}
      {modal==='gen'&&<GenerateModal onClose={()=>setModal(null)} onAdd={handleAdd}/>}
      <Toast msg={toast.msg} show={toast.show} type={toast.type}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<style>
  @media(max-width:768px){
    .sidebar{display:flex;}
    .mobile-menu{display:flex!important;}
  }
</style>
</body>
</html>
